<script>window.DATA={"version":"1.0.0 · 2026-11-22","tree":[{"id":"dieu","p":null,"fr":"Dieu","ar":"الله","sfr":"Ce que le texte dit de Dieu sur Lui-même : unicité, attributs, action dans la création, rapport avec les êtres.","sar":"ما يقوله النص عن الله: الوحدانية، الصفات، الفعل في الخلق، والعلاقة بالمخلوقات.","refs":[]},{"id":"cosmos","p":null,"fr":"Création et cosmos","ar":"الخلق والكون","sfr":"Cieux, terre, astres, eau, vivant : ce que décrivent les mots eux-mêmes.","sar":"السماوات والأرض والأجرام والماء والحياة كما تصفها الألفاظ.","refs":[]},{"id":"invisible","p":null,"fr":"L'invisible","ar":"الغيب","sfr":"Les êtres et réalités que l'humain ne voit pas : anges, jinns, Iblis, l'esprit.","sar":"ما لا يراه الإنسان: الملائكة، الجن، إبليس، الروح.","refs":[]},{"id":"humain","p":null,"fr":"L'humain","ar":"الإنسان","sfr":"Origine, nature, rôle et responsabilité de l'humain.","sar":"أصل الإنسان وطبيعته ودوره ومسؤوليته.","refs":[]},{"id":"revelation","p":null,"fr":"Révélation et messagers","ar":"الوحي والرسل","sfr":"Comment le texte se définit lui-même, les livres antérieurs et la fonction de messager.","sar":"كيف يعرّف النص نفسه، والكتب السابقة، ووظيفة الرسول.","refs":[]},{"id":"audela","p":null,"fr":"Fin du monde et au-delà","ar":"الساعة والآخرة","sfr":"Mort, fin du monde, résurrection, jugement, paradis et feu.","sar":"الموت، قيام الساعة، البعث، الحساب، الجنة والنار.","refs":[]},{"id":"culte","p":null,"fr":"Culte","ar":"العبادات","sfr":"Ce qui est exigé dans le rapport direct avec Dieu : prière, aumône, jeûne, pèlerinage, invocation.","sar":"ما هو مفروض في العلاقة المباشرة مع الله: الصلاة، الزكاة، الصيام، الحج، الدعاء.","refs":[]},{"id":"morale","p":null,"fr":"Morale et conduite","ar":"الأخلاق والسلوك","sfr":"Conseils et exigences de comportement envers soi et les autres.","sar":"التوجيهات والأوامر في السلوك مع النفس والناس.","refs":[]},{"id":"societe","p":null,"fr":"Société et lois","ar":"المجتمع والأحكام","sfr":"Famille, biens, contrats, sanctions, guerre et paix.","sar":"الأسرة، الأموال، العقود، العقوبات، الحرب والسلم.","refs":[]},{"id":"recits","p":null,"fr":"Récits","ar":"القصص","sfr":"Les histoires racontées, personnage par personnage.","sar":"القصص المروية شخصيةً شخصيةً.","refs":[]},{"id":"peuples","p":null,"fr":"Peuples et communautés","ar":"الأقوام والأمم","sfr":"Les groupes humains nommés et ce qui leur arrive.","sar":"الجماعات البشرية المذكورة ومصائرها.","refs":[]},{"id":"preuves","p":null,"fr":"Démonstrations logiques","ar":"البراهين","sfr":"Les raisonnements que le texte construit lui-même pour convaincre.","sar":"الحجج العقلية التي يبنيها النص بنفسه للإقناع.","refs":[]},{"id":"dieu-unicite","p":"dieu","fr":"Unicité","ar":"التوحيد","sfr":"Dieu est un, sans égal, sans engendrement, sans associé.","sar":"الله واحد لا مثيل له، لم يلد ولم يولد، ولا شريك له.","refs":[["112:1-4","D","Définition la plus condensée : un, l'absolu auquel on recourt (ṣamad), n'engendre pas, n'est pas engendré, rien ne Lui est équivalent.","احد"],["42:11","D","« Rien n'est comme Lui » : toute comparaison est exclue, tout en affirmant qu'Il entend et voit.","ليس كمثله"],["2:163","D","Votre dieu est un dieu unique ; pas de dieu sinon Lui.","اله وحد"],["6:103","D","Les regards ne L'atteignent pas ; Lui atteint les regards.","لا تدركه الابصر"],["4:48","X","L'association (shirk) est la seule faute présentée comme non pardonnée ; le reste dépend de Sa volonté.","ان يشرك به"],["31:13","C","Conseil de Luqmān à son fils : l'association est une injustice immense (ẓulm).","لظلم عظيم"]]},{"id":"dieu-attributs","p":"dieu","fr":"Noms et attributs","ar":"الأسماء والصفات","sfr":"Les qualités par lesquelles Dieu se désigne.","sar":"الصفات التي يسمّي الله بها نفسه.","refs":[["59:22-24","D","Série de noms : connaisseur de l'invisible et du visible, le Tout-Miséricordieux, le Roi, le Saint, la Paix, le Créateur, le Façonneur… « à Lui les plus beaux noms ».","الاسما الحسني"],["2:255","D","Le « verset du Trône » : vivant, subsistant par Lui-même, ni somnolence ni sommeil, Son siège (kursī) englobe cieux et terre.","الحي القيوم"],["57:3","D","Le Premier et le Dernier, l'Apparent et le Caché.","الاول والاخر"],["7:180","E","Ordre de L'invoquer par Ses plus beaux noms, et de laisser ceux qui les dévient.","الاسما الحسني"],["24:35","X","Dieu est la lumière des cieux et de la terre : image de la niche, de la lampe et du verre.","نور السموت"]]},{"id":"dieu-savoir","p":"dieu","fr":"Savoir et volonté","ar":"العلم والمشيئة","sfr":"Dieu sait tout et Sa volonté s'accomplit par un simple « Sois ».","sar":"علم الله محيط، ومشيئته تتحقق بكلمة «كن».","refs":[["6:59","D","Les clés de l'invisible sont chez Lui ; pas une feuille ne tombe sans qu'Il le sache.","مفاتح الغيب"],["36:82","D","Son ordre, quand Il veut une chose, est de lui dire « Sois » et elle est.","كن فيكون"],["54:49","D","Toute chose a été créée selon une mesure (qadar).","بقدر"],["57:22","X","Aucun malheur n'arrive sans être inscrit dans un écrit avant d'être produit.","في كتب من قبل"],["13:11","X","Dieu ne change pas l'état d'un peuple tant qu'ils ne changent pas ce qui est en eux-mêmes.","لا يغير ما بقوم"]]},{"id":"dieu-misericorde","p":"dieu","fr":"Miséricorde et pardon","ar":"الرحمة والمغفرة","sfr":"La miséricorde est présentée comme une règle que Dieu s'est imposée.","sar":"الرحمة مقدَّمة على أنها قاعدة كتبها الله على نفسه.","refs":[["6:12","D","Il s'est prescrit à Lui-même la miséricorde (kataba ʿalā nafsihi).","كتب علي نفسه الرحمه"],["7:156","D","Ma miséricorde englobe toute chose.","وسعت كل شي"],["39:53","C","« Ne désespérez pas de la miséricorde de Dieu : Il pardonne toutes les fautes. »","لا تقنطوا"],["1:1-7","D","Ouverture : louange, seigneurie des mondes, miséricorde, maîtrise du Jour de la rétribution, demande de guidance.","الرحمن الرحيم"]]},{"id":"dieu-proximite","p":"dieu","fr":"Proximité avec l'humain","ar":"القرب من الإنسان","sfr":"La relation directe entre Dieu et chaque individu, sans intermédiaire.","sar":"العلاقة المباشرة بين الله وكل فرد بلا واسطة.","refs":[["2:186","D","« Je suis proche : je réponds à l'appel de celui qui appelle quand il M'appelle. »","فاني قريب"],["50:16","D","Nous sommes plus proche de lui que la veine jugulaire ; Nous savons ce que son âme lui chuchote.","حبل الوريد"],["51:56","D","But déclaré de la création des jinns et des humains : qu'ils M'adorent.","ليعبدون"],["40:60","E","« Invoquez-Moi, Je vous répondrai. »","ادعوني استجب"]]},{"id":"cosmos-cieux","p":"cosmos","fr":"Cieux et terre","ar":"السماوات والأرض","sfr":"Origine commune, séparation, expansion, nombre des cieux.","sar":"الأصل المشترك، الفتق، الاتساع، عدد السماوات.","refs":[["21:30","B","Cieux et terre étaient une masse soudée (ratq) puis séparée (fatq) ; de l'eau, toute chose vivante.","رتقا ففتقنهما"],["41:11","H","Le ciel était fumée (dukhān) ; ordre aux deux de venir, de gré ou de force : « nous venons obéissants ».","دخان"],["51:47","D","Le ciel, Nous l'avons bâti avec force, et Nous l'étendons (mūsiʿūn, participe actif : action continue).","لموسعون"],["7:54","D","Création des cieux et de la terre en six « jours » (ayyām), puis établissement sur le Trône.","سته ايام"],["65:12","D","Sept cieux, et de la terre un nombre semblable.","سبع سموت"],["67:3-4","B","Sept cieux superposés : cherche une faille, ton regard reviendra épuisé.","طباقا"],["21:104","X","À la fin, le ciel sera plié comme on plie un rouleau d'écrits.","كطي السجل"]]},{"id":"cosmos-terre","p":"cosmos","fr":"La terre et sa forme","ar":"الأرض وهيئتها","sfr":"Ce que les mots disent de la forme de la terre, des montagnes, de la nuit et du jour.","sar":"ما تقوله الألفاظ عن هيئة الأرض والجبال والليل والنهار.","refs":[["39:5","D","Il enroule (yukawwiru) la nuit sur le jour et le jour sur la nuit. Kawwara = enrouler en boule, comme un turban autour d'une tête : l'image suppose une surface courbe.","يكور اليل"],["79:30","D","Après cela, Il a étendu la terre (daḥāhā). La racine d-ḥ-w désigne l'action d'étendre, d'aplanir.","دحيها"],["78:6-7","D","La terre comme lit (mihād), les montagnes comme piquets (awtād) : image de la tente maintenue.","اوتادا"],["16:15","X","Montagnes fermement posées pour que la terre ne tangue pas avec vous.","ان تميد"],["27:88","D","Tu crois les montagnes figées alors qu'elles passent comme passent les nuages.","مر السحاب"],["55:17","D","Seigneur des deux levants et des deux couchants : la pluralité des points de lever.","المشرقين"],["70:40","D","Seigneur des levants et des couchants (pluriel).","المشرق"]]},{"id":"cosmos-astres","p":"cosmos","fr":"Soleil, lune et orbites","ar":"الشمس والقمر والأفلاك","sfr":"Les astres se déplacent chacun sur une trajectoire.","sar":"الأجرام تسبح كلٌّ في مدار.","refs":[["21:33","D","Nuit, jour, soleil, lune : chacun nage (yasbaḥūn) dans une orbite (falak).","في فلك يسبحون"],["36:38-40","D","Le soleil court vers un point de séjour ; la lune a des phases ; le soleil ne rattrape pas la lune ; la nuit ne devance pas le jour.","لمستقر لها"],["10:5","X","Soleil = clarté (ḍiyāʾ), lune = lumière (nūr) ; ses phases servent au calcul des années.","ضيا والقمر نورا"],["71:16","D","La lune une lumière, le soleil une lampe (sirāj) : distinction entre ce qui éclaire et ce qui brûle.","سراجا"],["55:5","D","Soleil et lune selon un calcul précis (ḥusbān).","بحسبان"]]},{"id":"cosmos-eau","p":"cosmos","fr":"Eau, mers, pluie, vents","ar":"الماء والبحار والمطر والرياح","sfr":"Le cycle de l'eau et la frontière entre les eaux.","sar":"دورة الماء والحاجز بين البحار.","refs":[["25:53","D","Deux mers, l'une douce, l'autre salée, avec entre elles une barrière (barzakh) et un barrage.","برزخا"],["55:19-20","D","Il a laissé se rencontrer les deux mers ; entre elles une barrière qu'elles ne dépassent pas.","لا يبغيان"],["30:48","X","Les vents soulèvent les nuages, qui sont étendus puis fragmentés ; la pluie sort de leur intérieur.","فتثير سحابا"],["15:22","X","Vents fécondants (lawāqiḥ), puis eau du ciel que vous ne savez pas stocker.","لوقح"],["24:45","D","Tout animal créé d'eau : certains rampent, d'autres sur deux pattes, d'autres sur quatre.","كل دابه من ما"],["24:43","X","Nuages poussés, assemblés, empilés ; la pluie sort de leurs interstices ; grêle des « montagnes » du ciel.","ركاما"]]},{"id":"cosmos-vivant","p":"cosmos","fr":"Le vivant","ar":"الأحياء","sfr":"Paires, animaux, plantes : ce que le texte en dit.","sar":"الأزواج والحيوانات والنبات.","refs":[["51:49","D","De toute chose Nous avons créé deux (un couple).","زوجين"],["36:36","D","Les couples : dans ce que la terre fait pousser, en eux-mêmes, et dans ce qu'ils ne savent pas.","الازوج كلها"],["6:38","D","Pas d'animal sur terre ni d'oiseau volant qui ne forment des communautés (umam) comme vous.","امم امثالكم"],["16:68-69","X","L'abeille reçoit une inspiration (waḥy) ; de son ventre sort une boisson de couleurs variées, guérison pour les gens.","النحل"],["16:66","X","Le lait sort d'entre le contenu des intestins et le sang, pur et agréable.","فرث ودم"],["57:25","D","Nous avons fait descendre le fer, porteur d'une force redoutable et d'utilités.","الحديد"]]},{"id":"inv-anges","p":"invisible","fr":"Les anges","ar":"الملائكة","sfr":"Messagers dotés d'ailes, obéissants, avec des fonctions précises.","sar":"رسل ذوو أجنحة، مطيعون، لهم وظائف محددة.","refs":[["35:1","D","Dieu fait des anges des messagers dotés d'ailes, par deux, trois, quatre ; Il ajoute à la création ce qu'Il veut.","اولي اجنحه"],["66:6","D","Anges durs et sévères : ils ne désobéissent pas à ce qu'Il ordonne et font ce qu'on leur ordonne.","لا يعصون"],["21:19-20","D","Ils ne s'enorgueillissent pas de L'adorer, ne se lassent pas ; ils glorifient nuit et jour sans relâche.","لا يفترون"],["2:97-98","D","Jibrīl a fait descendre le texte sur ton cœur ; Jibrīl et Mīkāl sont nommés.","جبريل"],["50:17-18","D","Deux receveurs, à droite et à gauche ; pas une parole sans un observateur prêt.","رقيب عتيد"],["32:11","D","L'ange de la mort (malak al-mawt) chargé de vous recueillir.","ملك الموت"],["43:77","D","Mālik : gardien du feu, à qui les damnés crient.","يملك"],["2:102","H","Hārūt et Mārūt à Babylone : enseignent en avertissant « nous ne sommes qu'une épreuve ».","هروت"],["2:30","H","Dialogue : les anges questionnent la création d'un successeur sur terre ; ils ne savent pas ce que Dieu sait.","خليفه"],["97:4","D","Descente des anges et de l'Esprit (al-rūḥ) la nuit du Décret.","تنزل المليكه"]]},{"id":"inv-jinns","p":"invisible","fr":"Les jinns","ar":"الجن","sfr":"Créés de feu, responsables comme les humains, croyants ou non.","sar":"مخلوقون من نار، مكلّفون كالإنس، منهم المؤمن ومنهم غيره.","refs":[["55:15","D","Le jānn créé d'une flamme sans fumée (mārij min nār).","مارج"],["15:27","D","Le jānn créé auparavant d'un feu de vent brûlant (samūm) : antériorité sur l'humain.","السموم"],["51:56","D","Jinns et humains créés pour adorer : même responsabilité.","الجن والانس"],["72:1-2","H","Un groupe de jinns écoute le texte récité et dit : « nous avons entendu une lecture étonnante ».","قرانا عجبا"],["72:11","D","Parmi nous les vertueux et d'autres ; nous sommes des voies diverses.","طرايق قددا"],["72:8-9","H","Les jinns tentaient d'écouter le ciel ; ils le trouvent rempli de gardiens et de projectiles.","شهبا"],["46:29-31","H","Un groupe de jinns écoute, puis retourne avertir les siens.","نفرا من الجن"],["6:130","X","Au jugement, jinns et humains interrogés : « des messagers ne sont-ils pas venus de vous ? »","يمعشر الجن والانس"],["34:12-14","H","Jinns au service de Sulaymān ; ils ne s'aperçoivent de sa mort que lorsque le ver ronge son bâton : ils ne connaissent pas l'invisible.","منساته"],["55:33","B","Défi aux jinns et aux humains : franchissez les limites des cieux et de la terre si vous pouvez ; seulement avec un pouvoir (sulṭān).","اقطار السموت"]]},{"id":"inv-iblis","p":"invisible","fr":"Iblīs et Shayṭān","ar":"إبليس والشيطان","sfr":"Le refus de se prosterner, le serment d'égarer, et ses limites.","sar":"رفض السجود، والقسم على الإغواء، وحدود سلطانه.","refs":[["18:50","D","Iblīs « était des jinns » : il n'est donc pas un ange, même s'il était inclus dans l'ordre adressé aux anges.","كان من الجن"],["7:11-12","H","Refus de se prosterner ; argument : « je suis meilleur que lui, tu m'as créé de feu et lui d'argile ». Premier raisonnement par comparaison de matière.","انا خير منه"],["7:13-18","H","Expulsion ; il demande un délai jusqu'au jour de la résurrection, et jure d'assaillir l'humain par devant, derrière, à droite et à gauche.","لاقعدن"],["15:39-42","X","Limite : il n'a pas de pouvoir sur les serviteurs sincères, seulement sur ceux qui le suivent.","ليس لك عليهم"],["14:22","H","Discours d'Iblīs au jugement : « je n'avais sur vous aucun pouvoir sinon de vous appeler ; ne me blâmez pas, blâmez-vous ».","فلا تلوموني"],["35:6","E","Le Shayṭān est pour vous un ennemi : prenez-le comme ennemi.","فاتخذوه عدوا"],["2:268","X","Le Shayṭān vous promet la pauvreté et vous ordonne la turpitude.","يعدكم الفقر"],["17:64","X","Permission de séduire avec sa voix, sa cavalerie, et de s'associer aux biens et aux enfants.","واستفزز"],["7:27","C","Fils d'Adam, qu'il ne vous tente pas comme il a fait sortir vos parents ; lui et sa tribu vous voient d'où vous ne les voyez pas.","من حيث لا ترونهم"]]},{"id":"inv-esprit","p":"invisible","fr":"L'esprit (al-rūḥ)","ar":"الروح","sfr":"Une réalité dont le savoir humain est déclaré limité.","sar":"حقيقة يُعلَن أن علم الإنسان بها قليل.","refs":[["17:85","D","On t'interroge sur l'esprit : dis « l'esprit relève de l'ordre de mon Seigneur ; il ne vous a été donné que peu de savoir ».","الروح من امر"],["15:29","H","Après l'avoir façonné, « J'ai insufflé en lui de Mon esprit ».","ونفخت فيه من روحي"],["39:42","X","Dieu recueille les âmes à leur mort, et celles qui ne meurent pas pendant leur sommeil : le sommeil est une petite mort.","في منامها"]]},{"id":"hum-creation","p":"humain","fr":"Création de l'humain","ar":"خلق الإنسان","sfr":"D'argile puis d'une goutte, par étapes successives.","sar":"من طين ثم من نطفة، أطوارًا متتابعة.","refs":[["15:26","D","Humain créé d'argile sonore (ṣalṣāl), issue d'une boue malléable (ḥamaʾ masnūn).","صلصل"],["23:12-14","D","Étapes : extrait d'argile → goutte (nuṭfa) en lieu sûr → ʿalaqa (ce qui s'accroche) → muḍgha (chose mâchée) → os → os revêtus de chair → autre création.","مضغه"],["32:7-9","D","Commencement par l'argile, puis descendance par une eau vile ; façonnage, insufflation ; ouïe, vue, cœurs.","سلله من ما"],["22:5","B","Les étapes de la gestation utilisées comme preuve de la résurrection.","مخلقه"],["39:6","D","Création dans le ventre des mères, phase après phase, dans trois ténèbres.","ظلمت ثلث"],["96:1-2","E","Premier ordre : « Lis » ; l'humain créé d'une ʿalaqa.","اقرا"]]},{"id":"hum-role","p":"humain","fr":"Rôle et dignité","ar":"الدور والكرامة","sfr":"Successeur sur terre, porteur du dépôt, honoré.","sar":"خليفة في الأرض، حامل الأمانة، مكرَّم.","refs":[["2:30","D","« Je vais placer sur terre un successeur (khalīfa). »","خليفه"],["2:31-33","H","Adam reçoit les noms de toutes choses ; les anges ne les connaissent pas : le savoir fonde la supériorité.","الاسما كلها"],["33:72","D","Le dépôt (amāna) proposé aux cieux, à la terre et aux montagnes, qui refusent ; l'humain l'accepte.","الامانه"],["17:70","D","Nous avons honoré les fils d'Adam et les avons préférés à beaucoup de créatures.","كرمنا بني ادم"],["95:4-6","D","Créé dans la meilleure stature, puis ramené au plus bas, sauf ceux qui croient et agissent bien.","احسن تقويم"]]},{"id":"hum-nature","p":"humain","fr":"Nature et faiblesses","ar":"الطبيعة والضعف","sfr":"Le texte décrit l'humain sans complaisance.","sar":"يصف النص الإنسان دون مجاملة.","refs":[["4:28","D","L'humain a été créé faible.","ضعيفا"],["70:19-21","D","Créé impatient (halūʿ) : abattu si le mal le touche, avare si le bien le touche.","هلوعا"],["17:11","D","L'humain est pressé (ʿajūl).","عجولا"],["18:54","D","L'humain est, plus que toute chose, enclin à la dispute.","جدلا"],["96:6-7","D","L'humain dépasse les bornes dès qu'il se voit sans besoin.","ليطغي"],["12:53","D","L'âme incite fortement au mal (ammāra bil-sūʾ).","لاماره"],["75:2","D","L'âme qui se blâme elle-même (lawwāma).","اللوامه"],["89:27-28","D","L'âme apaisée (muṭmaʾinna) invitée à revenir à son Seigneur.","المطمينه"]]},{"id":"hum-liberte","p":"humain","fr":"Libre choix et responsabilité","ar":"الاختيار والمسؤولية","sfr":"Chaque individu choisit et répond de ses actes, seul.","sar":"كل فرد يختار ويُسأل عن عمله وحده.","refs":[["76:3","D","Nous lui avons montré le chemin, qu'il soit reconnaissant ou ingrat.","اما شاكرا"],["18:29","D","La vérité vient de votre Seigneur : qui veut croit, qui veut renie.","فمن شا فليومن"],["91:7-10","D","L'âme a reçu la connaissance de sa dépravation et de sa piété ; réussit qui la purifie.","فالهمها"],["2:256","E","Pas de contrainte dans la religion : la bonne voie s'est distinguée de l'égarement.","لا اكراه"],["6:164","D","Nul porteur ne portera le fardeau d'un autre.","وزر اخري"],["53:39","D","L'humain n'obtient que le fruit de ses efforts.","ما سعي"],["2:286","D","Dieu n'impose à une âme que selon sa capacité.","الا وسعها"]]},{"id":"hum-diversite","p":"humain","fr":"Diversité et égalité","ar":"التنوع والمساواة","sfr":"Origine commune, diversité voulue, seul critère : la piété.","sar":"أصل واحد، تنوع مقصود، والمعيار الوحيد التقوى.","refs":[["49:13","D","Créés d'un homme et d'une femme, en peuples et tribus pour vous connaître ; le plus noble est le plus pieux.","لتعارفوا"],["30:22","B","La diversité des langues et des couleurs est un signe.","السنتكم"],["4:1","D","Créés d'une âme unique (nafs wāḥida), de laquelle son conjoint.","نفس وحده"],["5:48","X","S'Il l'avait voulu, Il aurait fait de vous une seule communauté : rivalisez dans le bien.","فاستبقوا الخيرت"],["33:35","D","Hommes et femmes énumérés à égalité dans chaque qualité et dans la récompense.","المسلمين والمسلمت"]]},{"id":"rev-coran","p":"revelation","fr":"Le Coran se définit","ar":"القرآن يعرّف نفسه","sfr":"Livre sans doute, en langue arabe claire, préservé, à la fois clair et allusif.","sar":"كتاب لا ريب فيه، بلسان عربي مبين، محفوظ، منه محكم ومنه متشابه.","refs":[["2:2","D","Ce livre : pas de doute en lui, guidance pour ceux qui se prémunissent.","لا ريب فيه"],["12:2","D","Descendu en lecture arabe afin que vous raisonniez (taʿqilūn) : la langue est la clé de la compréhension.","قرنا عربيا"],["16:103","B","Réponse à l'accusation qu'un humain l'enseigne : la langue de celui qu'on désigne est étrangère, celle-ci est arabe claire.","اعجمي"],["15:9","D","C'est Nous qui avons fait descendre le Rappel, et Nous en sommes les gardiens.","لحفظون"],["3:7","D","Des versets fermes (muḥkamāt), mère du livre, et d'autres ambigus (mutashābihāt) ; ceux qui ont une déviation suivent l'ambigu.","محكمت"],["4:82","B","« Ne méditent-ils pas ? S'il venait d'un autre que Dieu, ils y trouveraient beaucoup de contradictions. » Critère de cohérence interne.","اختلفا كثيرا"],["97:1","H","Descendu pendant la nuit du Décret (laylat al-qadr).","ليله القدر"],["17:106","X","Lecture fragmentée pour être récitée aux gens avec lenteur, descendue progressivement.","علي مكث"],["47:24","C","Ne méditent-ils pas le Coran, ou y a-t-il des verrous sur des cœurs ?","اقفالها"],["73:4","E","Récite le Coran posément (rattil).","ترتيلا"]]},{"id":"rev-livres","p":"revelation","fr":"Livres antérieurs","ar":"الكتب السابقة","sfr":"Torah, Évangile, Psaumes, feuillets d'Ibrāhīm et Mūsā.","sar":"التوراة والإنجيل والزبور وصحف إبراهيم وموسى.","refs":[["3:3-4","D","Le Livre confirme ce qui le précède ; Torah et Évangile descendus auparavant.","التوريه والانجيل"],["5:44","D","La Torah contient guidance et lumière ; les prophètes jugeaient par elle.","فيها هدي ونور"],["5:46","D","ʿĪsā reçoit l'Évangile, confirmant la Torah.","الانجيل"],["4:163","D","Dāwūd a reçu le Zabūr.","زبورا"],["87:18-19","D","Feuillets (ṣuḥuf) d'Ibrāhīm et de Mūsā.","صحف ابرهيم"],["5:48","D","Le Coran comme gardien (muhaymin) de ce qui l'a précédé.","مهيمنا"],["2:79","X","Malheur à ceux qui écrivent le livre de leurs mains puis disent « cela vient de Dieu ».","يكتبون الكتب بايديهم"]]},{"id":"rev-messagers","p":"revelation","fr":"Fonction de messager","ar":"وظيفة الرسول","sfr":"Un messager pour chaque communauté, humain, dans la langue de son peuple.","sar":"لكل أمة رسول، بشر، بلسان قومه.","refs":[["16:36","D","Dans chaque communauté Nous avons envoyé un messager : adorez Dieu, évitez le ṭāghūt.","في كل امه رسولا"],["14:4","D","Tout messager est envoyé dans la langue de son peuple, pour leur expliquer.","بلسان قومه"],["40:78","D","Certains messagers Nous t'avons raconté leur récit, d'autres non : la liste n'est pas exhaustive.","لم نقصص"],["18:110","D","Dis : je ne suis qu'un humain comme vous, à qui il est révélé.","بشر مثلكم"],["2:285","E","Nous ne faisons pas de distinction entre Ses messagers.","لا نفرق"],["33:40","D","Muḥammad n'est le père d'aucun de vos hommes, il est messager de Dieu et sceau (khātam) des prophètes.","خاتم النبين"],["4:165","X","Messagers annonciateurs et avertisseurs, pour que les gens n'aient plus d'argument contre Dieu.","حجه بعد الرسل"],["6:50","D","Je ne prétends pas détenir les trésors de Dieu, ni connaître l'invisible, ni être un ange.","ولا اقول لكم اني ملك"]]},{"id":"ad-mort","p":"audela","fr":"La mort et l’entre-deux","ar":"الموت والبرزخ","sfr":"Toute âme goûte la mort ; une barrière la sépare de la résurrection.","sar":"كل نفس ذائقة الموت، وبينها وبين البعث برزخ.","refs":[["3:185","D","Toute âme goûtera la mort.","ذايقه الموت"],["50:19","H","L'ivresse de la mort arrive avec la vérité : « voilà ce que tu fuyais ».","سكره الموت"],["23:99-100","D","Le mourant demande à revenir pour faire le bien ; derrière eux une barrière (barzakh) jusqu'au jour où ils seront ressuscités.","برزخ"],["63:10-11","C","Dépensez avant que la mort ne vienne ; nul délai ne sera accordé.","لولا اخرتني"],["31:34","D","Nul ne sait en quelle terre il mourra.","باي ارض تموت"]]},{"id":"ad-heure","p":"audela","fr":"L'Heure (fin du monde)","ar":"الساعة","sfr":"Un bouleversement cosmique décrit par images successives.","sar":"انقلاب كوني موصوف بصور متتابعة.","refs":[["81:1-14","D","Le soleil enroulé, les étoiles ternies, les montagnes en marche, les mers allumées, la fillette enterrée vivante interrogée…","كورت"],["82:1-5","D","Le ciel fendu, les astres dispersés, les mers déversées, les tombes retournées.","انفطرت"],["99:1-8","D","La terre tremble et rapporte ses nouvelles ; le poids d'un atome de bien ou de mal sera vu.","مثقال ذره"],["101:1-11","D","Le fracas : les gens comme papillons dispersés, les montagnes comme laine cardée ; la balance lourde ou légère.","القارعه"],["7:187","D","Son savoir n'est que chez Dieu ; elle viendra soudainement.","بغته"],["18:94","H","Yaʾjūj et Maʾjūj, semeurs de désordre, derrière un barrage.","ياجوج"],["21:96","D","Lorsque Yaʾjūj et Maʾjūj seront relâchés, déferlant de toute hauteur.","ياجوج"],["27:82","D","Une bête (dābba) sortira de la terre et leur parlera.","دابه من الارض"]]},{"id":"ad-jugement","p":"audela","fr":"Résurrection et jugement","ar":"البعث والحساب","sfr":"Retour des corps, livre de chacun, balance, témoignage des membres.","sar":"إعادة الأجساد، كتاب كل إنسان، الميزان، شهادة الجوارح.","refs":[["36:51-53","H","On souffle dans la trompe : ils sortent des tombes, « qui nous a réveillés de notre couche ? »","في الصور"],["17:13-14","D","Chaque humain a son sort attaché au cou ; « lis ton livre, tu suffis aujourd'hui à te juger ».","اقرا كتبك"],["21:47","D","Balances justes ; même le poids d'une graine de moutarde sera produit.","الموزين القسط"],["36:65","D","Leurs mains parleront, leurs pieds témoigneront.","نختم علي افوههم"],["41:20-21","H","Ouïe, yeux et peaux témoignent ; ils disent à leurs peaux : « pourquoi témoignez-vous contre nous ? »","لجلودهم"],["69:19-26","H","Celui qui reçoit son livre dans la main droite se réjouit ; celui qui le reçoit à gauche souhaite ne jamais l'avoir reçu.","بيمينه"],["2:48","D","Un jour où nulle âme ne suffira à une autre, nulle compensation acceptée.","لا تجزي نفس"],["20:109","D","L'intercession ne profite qu'à celui à qui le Tout-Miséricordieux le permet.","الشفعه"]]},{"id":"ad-paradis","p":"audela","fr":"Le Jardin","ar":"الجنة","sfr":"Décrit par des images de rivières, ombres, paix et plus que cela.","sar":"موصوفة بالأنهار والظلال والسلام ومزيد.","refs":[["47:15","D","Rivières d'eau non altérée, de lait au goût inchangé, de vin délicieux, de miel purifié.","انهر من لبن"],["3:133","D","Un jardin large comme les cieux et la terre.","عرضها السموت"],["32:17","D","Nulle âme ne sait ce qui lui est réservé de fraîcheur des yeux : la description dépasse le connu.","قره اعين"],["56:25-26","D","On n'y entend ni futilité ni incitation au péché, seulement « paix, paix ».","سلما سلما"],["10:26","D","Pour ceux qui font le bien : le meilleur, et un surplus (ziyāda).","وزياده"],["15:47","D","Nous ôtons de leurs poitrines toute rancune ; frères sur des lits face à face.","غل"]]},{"id":"ad-feu","p":"audela","fr":"Le Feu","ar":"النار","sfr":"Châtiment décrit avec ses gardiens et ses dialogues.","sar":"عذاب موصوف بخزنته وحواراته.","refs":[["66:6","E","Préservez-vous et vos familles d'un feu dont le combustible est les gens et les pierres.","وقودها الناس"],["4:56","D","Chaque fois que leurs peaux sont consumées, Nous les remplaçons par d'autres.","نضجت جلودهم"],["67:8-10","H","Les gardiens demandent : « un avertisseur n'est-il pas venu ? » Réponse : « si nous avions écouté ou raisonné… »","لو كنا نسمع او نعقل"],["74:30-31","D","Au-dessus de lui dix-neuf ; ce nombre n'est donné que comme épreuve.","تسعه عشر"],["7:44-50","H","Dialogue entre gens du Jardin, gens du Feu et gens des hauteurs (aʿrāf).","الاعراف"]]},{"id":"culte-priere","p":"culte","fr":"La prière (ṣalāt)","ar":"الصلاة","sfr":"Exigence permanente, à des temps fixés, précédée de purification.","sar":"فريضة دائمة في أوقات محددة، تسبقها الطهارة.","refs":[["2:43","E","Accomplissez la prière, acquittez l'aumône, inclinez-vous avec ceux qui s'inclinent.","واقيموا الصلوه"],["4:103","E","La prière est une prescription à des temps déterminés (mawqūtan).","موقوتا"],["17:78","E","Prière du déclin du soleil jusqu'à l'obscurité de la nuit, et la lecture de l'aube.","لدلوك الشمس"],["11:114","E","Aux deux extrémités du jour et dans des heures proches de la nuit ; les bonnes actions effacent les mauvaises.","طرفي النهار"],["2:238","E","Préservez les prières, et la prière médiane.","الوسطي"],["5:6","E","Ablutions : visage, mains jusqu'aux coudes, tête, pieds ; sinon terre propre (tayammum).","المرافق"],["62:9","E","Le vendredi, à l'appel, hâtez-vous vers le rappel de Dieu et laissez le commerce.","الجمعه"],["29:45","X","La prière éloigne de la turpitude et du blâmable.","تنهي عن الفحشا"],["4:101","X","En voyage, raccourcir la prière n'est pas une faute.","تقصروا"],["2:144","E","Tourne ton visage vers la Mosquée sacrée (changement de direction, qibla).","شطر المسجد الحرام"]]},{"id":"culte-zakat","p":"culte","fr":"Aumône et dépense","ar":"الزكاة والإنفاق","sfr":"Part due aux ayants droit et dépense volontaire.","sar":"حق معلوم للمستحقين وإنفاق تطوعي.","refs":[["9:60","E","Les huit catégories de bénéficiaires des ṣadaqāt.","للفقرا والمسكين"],["2:261","X","La dépense comparée à une graine qui produit sept épis de cent grains.","سبع سنابل"],["2:264","E","N'annulez pas vos aumônes par le rappel du bienfait et la blessure.","بالمن والاذي"],["2:267","E","Donnez des bonnes choses que vous avez acquises, pas du mauvais.","من طيبت ما كسبتم"],["2:271","C","Donner en secret aux pauvres est meilleur pour vous.","تخفوها"],["70:24-25","D","Dans leurs biens un droit connu pour le demandeur et le démuni.","حق معلوم"]]},{"id":"culte-jeune","p":"culte","fr":"Le jeûne","ar":"الصيام","sfr":"Prescrit en Ramaḍān, avec exemptions et but déclaré.","sar":"مفروض في رمضان، مع رخص وغاية معلنة.","refs":[["2:183","E","Le jeûne vous est prescrit comme aux précédents, afin que vous vous prémunissiez.","كتب عليكم الصيام"],["2:184","X","Malade ou voyageur : un nombre égal d'autres jours ; ceux qui le peuvent difficilement : nourrir un pauvre.","فديه طعام"],["2:185","E","Le mois de Ramaḍān, dans lequel le Coran a été descendu ; Dieu veut pour vous la facilité.","شهر رمضان"],["2:187","E","Manger et boire jusqu'à distinguer le fil blanc du fil noir de l'aube ; relations permises la nuit.","الخيط الابيض"]]},{"id":"culte-hajj","p":"culte","fr":"Le pèlerinage","ar":"الحج","sfr":"Obligation pour qui en a les moyens, avec des rites précis.","sar":"فرض على المستطيع، بمناسك محددة.","refs":[["3:96-97","E","Première maison posée pour les gens, à Bakka ; pèlerinage dû par qui en a le moyen.","ببكه"],["2:196","E","Accomplissez le ḥajj et la ʿumra pour Dieu ; règles en cas d'empêchement.","واتموا الحج"],["2:197","E","Le ḥajj en des mois connus : ni relation, ni perversité, ni dispute.","ولا جدال"],["2:158","D","Ṣafā et Marwa font partie des rites.","الصفا والمروه"],["22:27","E","Appelle les gens au pèlerinage : ils viendront à pied et sur toute monture amaigrie.","واذن في الناس بالحج"],["22:37","X","Ni leur chair ni leur sang n'atteignent Dieu, c'est votre piété qui L'atteint.","لن ينال الله"]]},{"id":"culte-dhikr","p":"culte","fr":"Invocation et rappel","ar":"الدعاء والذكر","sfr":"Parler à Dieu et se souvenir de Lui.","sar":"مخاطبة الله وذكره.","refs":[["7:55","C","Invoquez votre Seigneur humblement et en secret.","تضرعا وخفيه"],["13:28","D","C'est par le rappel de Dieu que les cœurs s'apaisent.","تطمين القلوب"],["33:41-42","E","Rappelez-vous Dieu abondamment, glorifiez-Le matin et soir.","ذكرا كثيرا"],["2:152","D","Rappelez-vous de Moi, Je me rappellerai de vous.","فاذكروني اذكركم"],["7:205","C","Rappelle-toi de ton Seigneur en toi-même, sans élever la voix.","دون الجهر"]]},{"id":"mor-parents","p":"morale","fr":"Les parents","ar":"الوالدان","sfr":"Le devoir envers les parents suit directement l'adoration de Dieu.","sar":"الإحسان إلى الوالدين يلي مباشرة عبادة الله.","refs":[["17:23-24","E","Bonté envers les parents ; ne pas leur dire même « uff » ; abaisser pour eux l'aile de l'humilité.","اف"],["31:14-15","E","La mère l'a porté faiblesse sur faiblesse ; s'ils te poussent à associer, ne leur obéis pas, mais accompagne-les avec bonté.","وهنا علي وهن"],["46:15","D","Portage et sevrage : trente mois ; à quarante ans, la maturité.","ثلثون شهرا"]]},{"id":"mor-justice","p":"morale","fr":"Justice et témoignage","ar":"العدل والشهادة","sfr":"La justice prime même contre soi et même envers l'ennemi.","sar":"العدل مقدَّم ولو على النفس ومع العدو.","refs":[["4:135","E","Soyez fermes dans l'équité, témoins pour Dieu, même contre vous-mêmes, vos parents ou vos proches.","ولو علي انفسكم"],["5:8","E","Que la haine d'un peuple ne vous pousse pas à être injustes ; soyez justes.","شنان قوم"],["16:90","E","Dieu ordonne la justice, la bienfaisance et le don aux proches ; Il interdit turpitude, blâmable et oppression.","بالعدل والاحسن"],["4:58","E","Rendez les dépôts à leurs ayants droit ; jugez avec justice.","تودوا الامنت"],["83:1-3","E","Malheur aux fraudeurs qui exigent la pleine mesure et donnent moins.","للمطففين"],["55:7-9","E","La balance posée : ne la faussez pas.","ولا تخسروا الميزان"]]},{"id":"mor-parole","p":"morale","fr":"La parole","ar":"القول","sfr":"Parler bien, vérifier, ne pas médire.","sar":"حسن القول، التثبت، اجتناب الغيبة.","refs":[["2:83","E","Dites aux gens de bonnes paroles.","حسنا"],["49:6","E","Si un pervers vous apporte une nouvelle, vérifiez-la (tabayyanū).","فتبينوا"],["49:11","E","Ne vous moquez pas les uns des autres ; ne vous donnez pas de sobriquets.","لا يسخر قوم"],["49:12","E","Évitez la conjecture, n'espionnez pas, ne médisez pas : image de manger la chair de son frère mort.","لحم اخيه ميتا"],["17:36","E","Ne suis pas ce dont tu n'as pas la connaissance : l'ouïe, la vue et le cœur seront interrogés.","ولا تقف"],["33:70","E","Dites une parole juste et droite (sadīd).","سديدا"],["16:125","C","Appelle avec sagesse et bonne exhortation ; discute de la meilleure manière.","بالحكمه"]]},{"id":"mor-patience","p":"morale","fr":"Patience et épreuve","ar":"الصبر والابتلاء","sfr":"La vie est présentée comme une épreuve ; la patience comme réponse.","sar":"الحياة ابتلاء، والصبر هو الجواب.","refs":[["2:155-157","X","Épreuve par la peur, la faim, les pertes ; les patients disent « nous sommes à Dieu et vers Lui nous retournons ».","انا لله"],["67:2","D","Il a créé la mort et la vie pour éprouver lequel agit le mieux.","ليبلوكم"],["94:5-6","D","Avec la difficulté, la facilité (répété deux fois).","مع العسر يسرا"],["103:1-3","D","L'humain est en perte, sauf ceux qui croient, agissent bien, s'exhortent à la vérité et à la patience.","لفي خسر"],["2:153","C","Cherchez secours dans la patience et la prière.","بالصبر والصلوه"],["29:2","D","Les gens pensent-ils qu'on les laissera dire « nous croyons » sans être éprouvés ?","لا يفتنون"]]},{"id":"mor-humilite","p":"morale","fr":"Humilité, pardon, maîtrise","ar":"التواضع والعفو","sfr":"Ne pas s'enorgueillir, maîtriser sa colère, pardonner.","sar":"اجتناب الكبر، كظم الغيظ، العفو.","refs":[["31:18-19","C","Ne détourne pas ta joue des gens, ne marche pas avec arrogance ; baisse ta voix.","واغضض من صوتك"],["17:37","C","Tu ne fendras pas la terre ni n'atteindras la hauteur des montagnes.","لن تخرق الارض"],["3:134","C","Ceux qui contiennent leur colère et pardonnent aux gens.","والكظمين الغيظ"],["41:34","C","Repousse le mal par ce qui est meilleur : l'ennemi devient comme un ami chaleureux.","ادفع بالتي هي احسن"],["42:40","X","La rétribution d'un mal est un mal égal ; qui pardonne et réconcilie, sa récompense incombe à Dieu.","فمن عفا"],["24:22","C","Qu'ils pardonnent : n'aimez-vous pas que Dieu vous pardonne ?","الا تحبون"],["25:63","D","Les serviteurs du Tout-Miséricordieux marchent humblement ; aux ignorants ils disent « paix ».","هونا"]]},{"id":"mor-engagements","p":"morale","fr":"Engagements et biens d’autrui","ar":"العهود وأموال الناس","sfr":"Tenir parole, ne pas dévorer le bien d'autrui.","sar":"الوفاء بالعهد وعدم أكل أموال الناس.","refs":[["5:1","E","Remplissez les contrats (ʿuqūd).","اوفوا بالعقود"],["17:34","E","Remplissez l'engagement : on en sera interrogé.","العهد كان مسولا"],["2:188","E","Ne dévorez pas vos biens entre vous injustement, ni ne corrompez les juges.","وتدلوا بها"],["17:26-27","E","Donne au proche, au pauvre, au voyageur ; ne gaspille pas : les gaspilleurs sont frères des démons.","المبذرين"],["25:67","D","Ceux qui dépensent sans excès ni avarice, entre les deux.","قواما"]]},{"id":"soc-mariage","p":"societe","fr":"Mariage et couple","ar":"الزواج","sfr":"Le couple comme lieu de repos, d'affection et de miséricorde.","sar":"الزوجية سكن ومودة ورحمة.","refs":[["30:21","D","Il a créé pour vous des épouses de vous-mêmes pour que vous trouviez repos auprès d'elles ; affection et miséricorde.","مودة"],["2:187","D","Elles sont un vêtement pour vous et vous êtes un vêtement pour elles.","لباس لكم"],["4:3","E","Épousez deux, trois ou quatre ; si vous craignez de ne pas être justes, une seule.","فوحده"],["4:129","X","Vous ne pourrez pas être parfaitement équitables entre les femmes, même si vous le désirez.","ولن تستطيعوا"],["4:4","E","Donnez aux femmes leur dot (ṣaduqāt) de bon gré.","صدقتهن"],["4:19","E","Il ne vous est pas permis d'hériter des femmes contre leur gré ; vivez avec elles convenablement.","وعاشروهن"],["4:23","E","Liste des femmes interdites au mariage.","حرمت عليكم امهتكم"],["4:34","X","Les hommes ont la charge (qawwāmūn) des femmes en raison de ce qu'ils dépensent de leurs biens ; règles en cas de conflit.","قومون"],["4:35","C","En cas de discorde : un arbitre de la famille de chacun.","حكما من اهله"]]},{"id":"soc-divorce","p":"societe","fr":"Divorce","ar":"الطلاق","sfr":"Procédure en étapes, délais d'attente, droits de la femme.","sar":"إجراء على مراحل، عدة، حقوق المرأة.","refs":[["2:228","E","Délai d'attente de trois périodes ; elles ont des droits équivalents à leurs obligations.","ثلثه قرو"],["2:229","E","Le divorce est deux fois ; puis retenir convenablement ou libérer avec bonté.","الطلق مرتان"],["2:231","E","Ne les retenez pas pour leur nuire.","ضرارا"],["65:1","E","Ne les faites pas sortir de leurs maisons pendant le délai.","لا تخرجوهن"],["2:241","E","Aux divorcées une jouissance convenable (matāʿ).","وللمطلقت"]]},{"id":"soc-heritage","p":"societe","fr":"Héritage","ar":"المواريث","sfr":"Parts fixées, précédées par le testament et les dettes.","sar":"أنصبة مفروضة بعد الوصية والدين.","refs":[["4:7","D","Aux hommes une part, aux femmes une part de ce que laissent parents et proches.","وللنسا نصيب"],["4:11","E","Parts des enfants et des parents ; après testament ou dette.","مثل حظ الانثيين"],["4:12","E","Parts des conjoints et des frères et sœurs utérins.","كلله"],["4:176","E","La kalāla : héritage sans ascendant ni descendant.","الكلله"],["2:180","E","Le testament prescrit aux parents et proches.","الوصيه"]]},{"id":"soc-orphelins","p":"societe","fr":"Orphelins et faibles","ar":"اليتامى والضعفاء","sfr":"Protection insistante des biens et de la dignité des orphelins.","sar":"حماية مؤكدة لأموال اليتامى وكرامتهم.","refs":[["4:2","E","Donnez aux orphelins leurs biens ; n'échangez pas le bon contre le mauvais.","واتوا اليتمي"],["4:10","X","Ceux qui dévorent injustement les biens des orphelins avalent du feu dans leurs ventres.","امول اليتمي ظلما"],["93:9-10","E","L'orphelin, ne l'opprime pas ; le demandeur, ne le repousse pas.","فلا تقهر"],["107:1-3","D","Celui qui traite la religion de mensonge est celui qui repousse l'orphelin.","يدع اليتيم"],["90:11-16","D","La « pente raide » : affranchir un esclave, nourrir un orphelin proche ou un pauvre dans la poussière.","العقبه"]]},{"id":"soc-alimentation","p":"societe","fr":"Alimentation et boissons","ar":"الأطعمة والأشربة","sfr":"Ce qui est interdit est listé ; le reste est permis.","sar":"المحرمات معدودة، وما سواها حلال.","refs":[["2:168","E","Mangez de ce qui est sur terre, licite et bon.","حللا طيبا"],["2:173","E","Interdits : bête morte, sang, porc, ce qui est consacré à un autre que Dieu ; exception en cas de contrainte.","الخنزير"],["5:3","E","Liste détaillée : étouffée, assommée, tombée, encornée, entamée par un fauve…","والمنخنقه"],["5:90-91","E","Vin, jeux de hasard, pierres dressées, flèches divinatoires : souillure, évitez-les ; le démon veut susciter hostilité et haine.","الخمر والميسر"],["2:219","X","Étape antérieure : vin et jeu contiennent un grand péché et des utilités, mais le péché est plus grand.","واثمهما اكبر"],["5:96","E","Le gibier de la mer vous est permis.","صيد البحر"],["7:31","C","Mangez et buvez sans excès.","ولا تسرفوا"]]},{"id":"soc-economie","p":"societe","fr":"Commerce, intérêt, dettes","ar":"البيع والربا والدين","sfr":"Le commerce est permis, l'usure interdite, la dette écrite.","sar":"البيع حلال، الربا حرام، الدين يُكتب.","refs":[["2:275","E","Dieu a rendu licite le commerce et illicite le ribā ; réponse à « le commerce est comme le ribā ».","واحل الله البيع"],["2:278-279","E","Renoncez au reste du ribā ; à vous votre capital, sans léser ni être lésés.","روس امولكم"],["2:280","C","Si le débiteur est en difficulté, attendez une aisance ; remettre la dette est meilleur.","فنظره"],["2:282","E","Le plus long verset : toute dette à terme doit être écrite, avec témoins.","فاكتبوه"],["4:29","E","Commerce par consentement mutuel ; ne vous tuez pas.","عن تراض"],["59:7","X","Pour que la richesse ne circule pas seulement entre les riches.","دوله بين الاغنيا"]]},{"id":"soc-penal","p":"societe","fr":"Vie, sanctions, interdits graves","ar":"النفس والحدود","sfr":"Sacralité de la vie et peines prévues.","sar":"حرمة النفس والعقوبات المقررة.","refs":[["5:32","D","Qui tue une âme sans raison, c'est comme s'il avait tué tous les gens ; qui la fait vivre, comme s'il les avait tous fait vivre.","قتل الناس جميعا"],["17:33","E","Ne tuez pas l'âme que Dieu a rendue sacrée, sauf de droit.","النفس التي حرم"],["2:178-179","X","Le talion (qiṣāṣ) ; le pardon est possible ; dans le talion il y a une vie.","القصاص حيوه"],["17:31","E","Ne tuez pas vos enfants par crainte de pauvreté.","خشيه املق"],["17:32","E","N'approchez pas la fornication : c'est une turpitude.","ولا تقربوا الزني"],["24:2","E","Peine de cent coups pour le fornicateur et la fornicatrice.","مايه جلده"],["24:4","E","Accuser une femme sans quatre témoins : quatre-vingts coups, et témoignage refusé.","اربعه شهدا"],["5:38","E","Le voleur et la voleuse : coupez-leur les mains.","والسارق"],["4:29","E","Ne vous tuez pas vous-mêmes.","ولا تقتلوا انفسكم"]]},{"id":"soc-guerre","p":"societe","fr":"Combat et paix","ar":"القتال والسلم","sfr":"Combat permis contre l'agression, limites, préférence pour la paix.","sar":"القتال مأذون به ضد العدوان، بحدود، مع تفضيل السلم.","refs":[["22:39","D","Permission donnée à ceux qui sont combattus, parce qu'ils ont été lésés.","اذن للذين يقتلون"],["2:190","E","Combattez ceux qui vous combattent, et ne transgressez pas.","ولا تعتدوا"],["8:61","E","S'ils inclinent à la paix, incline vers elle.","للسلم"],["60:8","X","Dieu n'interdit pas d'être bons et justes envers ceux qui ne vous ont pas combattus.","ان تبروهم"],["4:90","E","S'ils se retirent et vous offrent la paix, pas de voie contre eux.","والقوا اليكم السلم"],["49:9","E","Deux groupes de croyants qui se combattent : réconciliez-les.","فاصلحوا بينهما"]]},{"id":"soc-gouvernance","p":"societe","fr":"Gouvernance et tenue","ar":"الشورى والآداب العامة","sfr":"Consultation, obéissance, pudeur, salutation.","sar":"الشورى، الطاعة، الحياء، التحية.","refs":[["42:38","D","Leur affaire est consultation entre eux (shūrā).","وامرهم شوري"],["3:159","C","Si tu avais été rude, ils se seraient dispersés ; consulte-les.","وشاورهم"],["4:59","E","Obéissez à Dieu, au messager, et aux détenteurs de l'autorité ; en cas de désaccord, référez à Dieu et au messager.","واولي الامر"],["24:30-31","E","Hommes puis femmes : baisser le regard, préserver la pudeur ; voile (khimār) sur les poitrines.","بخمرهن"],["33:59","E","Que les femmes ramènent sur elles leurs grands voiles, pour être reconnues et non offensées.","جلبيبهن"],["24:27","E","N'entrez pas dans des maisons autres que les vôtres sans permission et salutation.","تستانسوا"],["4:86","E","Répondez à une salutation par une meilleure ou par la même.","بتحيه"]]},{"id":"pe-israel","p":"peuples","fr":"Les fils d'Isrāʾīl","ar":"بنو إسرائيل","sfr":"Peuple le plus cité : bienfaits, alliance, manquements, errance.","sar":"أكثر الأقوام ذكرًا: النعم، الميثاق، النقض، التيه.","refs":[["2:47","D","Je vous ai préférés aux mondes (de votre temps).","فضلتكم"],["2:49-50","H","Délivrance de Pharaon qui égorgeait les fils ; la mer fendue.","فرقنا بكم البحر"],["2:57","H","Ombre des nuages, manne et cailles.","المن والسلوي"],["2:63","H","L'alliance sous le mont élevé au-dessus d'eux.","الطور"],["5:12","H","Alliance et douze chefs (naqīb).","اثني عشر نقيبا"],["5:21-26","H","Refus d'entrer dans la terre sainte : « va avec ton Seigneur, combattez ; nous restons ici » ; errance de quarante ans.","اربعين سنه"],["2:65","H","Ceux qui transgressèrent le sabbat.","السبت"],["17:4-7","X","Deux corruptions annoncées sur terre, et deux châtiments.","لتفسدن"]]},{"id":"pe-livre","p":"peuples","fr":"Gens du Livre","ar":"أهل الكتاب","sfr":"Juifs et chrétiens : appel au terrain commun et critiques.","sar":"اليهود والنصارى: دعوة إلى الكلمة السواء ونقد.","refs":[["3:64","E","Venez à une parole commune entre nous : n'adorer que Dieu.","كلمه سوا"],["3:113","D","Ils ne sont pas tous pareils : parmi eux une communauté droite.","ليسوا سوا"],["5:82","D","Les plus proches en affection : ceux qui disent « nous sommes chrétiens », car il y a parmi eux prêtres et moines.","نصري"],["29:46","E","Ne discutez avec eux que de la meilleure manière.","ولا تجدلوا اهل الكتب"],["2:62","D","Croyants, juifs, chrétiens, sabéens : qui croit en Dieu et au Dernier Jour et agit bien a sa récompense.","والصبين"],["9:30","D","Les juifs ont dit « ʿUzayr est fils de Dieu », les chrétiens « le Messie est fils de Dieu ».","عزير"]]},{"id":"pe-detruits","p":"peuples","fr":"Peuples anéantis","ar":"الأمم الهالكة","sfr":"Modèle répété : messager → refus → avertissement → anéantissement.","sar":"نمط متكرر: رسول → تكذيب → إنذار → هلاك.","refs":[["29:40","X","Chacun saisi pour son péché : ouragan de pierres, Cri, engloutissement, noyade.","حاصبا"],["89:6-14","H","ʿĀd et Iram aux colonnes, Thamūd qui taillaient le rocher, Pharaon aux piquets.","ارم ذات العماد"],["69:4-8","H","Thamūd par le fracas, ʿĀd par un vent glacial durant sept nuits et huit jours.","سبع ليال"],["34:15-17","H","Sabaʾ : deux jardins, ils se détournent ; la crue de la digue (al-ʿarim).","العرم"],["105:1-5","H","Les gens de l'éléphant ; oiseaux en groupes lançant des pierres d'argile.","الفيل"],["85:4-8","H","Gens de la fosse (ukhdūd) qui brûlaient les croyants.","الاخدود"],["36:13-29","H","La cité aux trois messagers ; un homme accourt de l'extrémité de la ville pour les soutenir.","اقصا المدينه"]]},{"id":"pe-quraysh","p":"peuples","fr":"Quraysh et La Mecque","ar":"قريش ومكة","sfr":"Le peuple du Prophète Muḥammad.","sar":"قوم النبي محمد.","refs":[["106:1-4","H","Pacte des Quraysh : caravanes d'hiver et d'été ; nourris contre la faim, sécurisés contre la peur.","لايلف قريش"],["90:1-2","D","Serment par cette cité où tu résides.","البلد"],["111:1-5","H","Abū Lahab et sa femme porteuse de bois.","ابي لهب"],["8:30","H","Complot pour l'emprisonner, le tuer ou l'expulser.","او يخرجوك"],["53:19-23","B","Al-Lāt, al-ʿUzzā, Manāt : « ce ne sont que des noms que vous avez nommés ».","اللت"]]},{"id":"pr-unicite","p":"preuves","fr":"Preuves de l'unicité","ar":"براهين التوحيد","sfr":"Raisonnements par l'absurde : plusieurs dieux = désordre.","sar":"استدلال بالخُلف: تعدد الآلهة يعني الفساد.","refs":[["21:22","B","S'il y avait en eux des divinités autres que Dieu, ils seraient corrompus. Raisonnement par l'absurde.","لفسدتا"],["23:91","B","Chaque dieu emporterait ce qu'il a créé et certains domineraient les autres.","لذهب كل اله"],["17:42","B","S'il y avait d'autres dieux, ils chercheraient un chemin vers le maître du Trône.","لابتغوا"],["22:73","B","Ceux que vous invoquez ne créeraient pas une mouche, même réunis ; si la mouche leur dérobe quelque chose, ils ne le récupèrent pas.","ذبابا"],["29:41","B","Ceux qui prennent des protecteurs : comme l'araignée ; la plus fragile des maisons.","العنكبوت"],["16:17","B","Celui qui crée est-il comme celui qui ne crée pas ?","افمن يخلق"],["39:29","B","Homme possédé par des associés en dispute vs homme appartenant à un seul : sont-ils égaux ?","شركا متشكسون"]]},{"id":"pr-createur","p":"preuves","fr":"Preuves de l'existence d'un créateur","ar":"براهين الخالق","sfr":"L'argument de la cause : rien ne vient de rien.","sar":"دليل السببية: لا شيء من لا شيء.","refs":[["52:35-36","B","Ont-ils été créés de rien, ou sont-ils les créateurs ? Ont-ils créé les cieux et la terre ? Trois hypothèses, toutes exclues.","من غير شي"],["41:53","B","Nous leur montrerons Nos signes dans les horizons et en eux-mêmes.","في الافاق"],["51:20-21","B","Sur terre des signes, et en vous-mêmes : ne voyez-vous pas ?","افلا تبصرون"],["88:17-20","B","Regardez le chameau, le ciel élevé, les montagnes dressées, la terre étalée (suṭiḥat).","سطحت"],["3:190-191","B","Dans la création et l'alternance nuit/jour, des signes pour ceux doués d'intelligence.","لاولي الالبب"],["6:76-79","B","Ibrāhīm : l'étoile, la lune, le soleil se couchent, « je n'aime pas ceux qui disparaissent ». Ce qui change ne peut être Dieu.","الافلين"],["20:49-50","B","Pharaon : « qui est votre Seigneur ? » Mūsā : « celui qui a donné à chaque chose sa création puis l'a guidée ».","اعطي كل شي خلقه"]]},{"id":"pr-resurrection","p":"preuves","fr":"Preuves de la résurrection","ar":"براهين البعث","sfr":"Qui a commencé peut recommencer ; la terre morte revit.","sar":"من بدأ قادر على الإعادة؛ الأرض الميتة تحيا.","refs":[["36:78-79","B","« Qui fera revivre des os en poussière ? » Réponse : celui qui les a créés une première fois.","رميم"],["30:27","B","Il commence la création puis la refait, et c'est plus facile pour Lui.","اهون عليه"],["36:81","B","Celui qui a créé cieux et terre n'est-il pas capable de créer leurs semblables ? Argument du plus grand au plus petit.","بقدر علي ان يخلق مثلهم"],["41:39","B","La terre inerte frémit sous l'eau : celui qui la ravive ravivera les morts.","اهتزت وربت"],["75:3-4","B","L'humain croit-il que Nous ne rassemblerons pas ses os ? Nous pouvons reformer jusqu'à ses extrémités des doigts (banān).","بنانه"],["2:259","H","Un homme passe près d'une ville en ruines ; mort cent ans puis ramené ; on lui montre son âne recomposé.","مايه عام"],["2:260","H","Ibrāhīm demande à voir ; quatre oiseaux découpés, dispersés, qui reviennent.","اربعه من الطير"]]},{"id":"pr-coran","p":"preuves","fr":"Le défi du texte","ar":"التحدي","sfr":"Le texte se met lui-même à l'épreuve : produisez-en autant.","sar":"النص يتحدى بنفسه: ائتوا بمثله.","refs":[["17:88","B","Si humains et jinns s'unissaient pour produire l'équivalent de ce Coran, ils n'y arriveraient pas.","بمثل هذا القران"],["11:13","B","Apportez dix sourates semblables, inventées.","بعشر سور"],["2:23-24","B","Apportez une seule sourate semblable ; vous ne le ferez pas.","بسوره من مثله"],["29:48","B","Tu ne récitais aucun livre auparavant et n'en écrivais pas de ta main : sinon les falsificateurs auraient douté.","تخطه بيمينك"],["4:82","B","Absence de contradiction comme critère.","اختلفا كثيرا"]]},{"id":"r-adam","p":"recits","fr":"Adam et son épouse","ar":"آدم وزوجه","sfr":"Création, prosternation des anges, le jardin, l'arbre, la descente, le repentir. L'épouse n'est jamais nommée dans le texte.","sar":"الخلق، سجود الملائكة، الجنة، الشجرة، الهبوط، التوبة. الزوجة لا يُذكر اسمها في النص.","refs":[["2:35-36","H","« Habite le jardin, toi et ton épouse ; n'approchez pas cet arbre. » Le démon les fait glisser.","هذه الشجره"],["7:20-22","H","Le démon chuchote aux deux ; ils goûtent ; leur nudité leur apparaît ; feuilles du jardin.","سوتهما"],["7:23","H","Prière commune : « Seigneur, nous nous sommes fait du tort. » La faute est partagée, sans accuser la femme.","ظلمنا انفسنا"],["20:115","X","Adam a oublié ; Nous ne lui avons pas trouvé de résolution ferme.","فنسي"],["20:120-122","H","« L'arbre de l'éternité et un royaume impérissable » ; puis son Seigneur l'élit et accepte son repentir.","شجره الخلد"],["2:37","H","Adam reçoit des paroles de son Seigneur ; repentir accepté.","فتلقي ادم"],["2:38","D","Une guidance viendra : qui la suit n'aura ni crainte ni tristesse.","فمن تبع هداي"],["3:59","B","ʿĪsā est comme Adam : créé de terre, puis « sois ».","كمثل ادم"]]},{"id":"r-fils-adam","p":"recits","fr":"Les deux fils d'Adam","ar":"ابنا آدم","sfr":"Premier meurtre ; les noms ne sont pas donnés dans le texte.","sar":"أول جريمة قتل؛ الأسماء غير مذكورة في النص.","refs":[["5:27-31","H","Offrande acceptée d'un seul ; « si tu tends ta main pour me tuer, je ne tendrai pas la mienne » ; un corbeau montre comment enterrer.","غرابا"],["5:32","D","Conséquence législative tirée du récit.","من اجل ذلك"]]},{"id":"r-nuh","p":"recits","fr":"Nūḥ","ar":"نوح","sfr":"Prédication de 950 ans, l'arche, le fils qui refuse, le déluge.","sar":"دعوة ألف سنة إلا خمسين، السفينة، الابن الرافض، الطوفان.","refs":[["29:14","H","Il resta parmi eux mille ans moins cinquante.","الف سنه الا خمسين"],["71:5-9","H","« Je les ai appelés nuit et jour, ils mettaient leurs doigts dans leurs oreilles » ; en public et en secret.","اصبعهم"],["11:37-38","H","Construction de l'arche sous Nos yeux ; les notables se moquent.","الفلك باعيننا"],["11:40","H","Embarque un couple de chaque espèce.","زوجين اثنين"],["11:42-43","H","Son fils refuse : « je me réfugierai sur une montagne » ; les vagues les séparent.","سـاوي"],["11:45-46","H","« Mon fils est de ma famille ! » Réponse : « il n'est pas de ta famille, c'est un acte non vertueux ». Le lien de foi prime le lien de sang.","ليس من اهلك"],["11:44","H","Terre, absorbe ton eau ; ciel, arrête-toi ; l'arche s'installe sur al-Jūdī.","الجودي"],["66:10","X","Femme de Nūḥ et femme de Lūṭ : exemples d'infidélité malgré leurs maris vertueux.","امرات نوح"]]},{"id":"r-hud","p":"recits","fr":"Hūd et ʿĀd","ar":"هود وعاد","sfr":"Peuple puissant bâtisseur, anéanti par le vent.","sar":"قوم أقوياء بناة، أهلكتهم الريح.","refs":[["7:65-72","H","Hūd, leur frère : « adorez Dieu » ; ils l'accusent de sottise.","هودا"],["26:128-130","H","Ils bâtissent sur chaque hauteur un monument par vanité.","ريع"],["41:15","H","« Qui est plus fort que nous ? »","من اشد منا قوه"],["46:24-25","H","Ils voient un nuage et croient à la pluie : c'est le châtiment.","عارضا"]]},{"id":"r-salih","p":"recits","fr":"Ṣāliḥ et Thamūd","ar":"صالح وثمود","sfr":"La chamelle comme signe, tuée par les plus misérables.","sar":"الناقة آية، عقرها أشقاهم.","refs":[["7:73","H","Voici la chamelle de Dieu, un signe ; laissez-la paître.","ناقه الله"],["26:155","E","À elle un jour de boisson, à vous un jour déterminé.","شرب"],["91:11-15","H","Le plus misérable s'élance ; ils la tuent ; anéantissement.","فعقروها"],["27:48-49","H","Neuf hommes complotent d'attaquer Ṣāliḥ de nuit.","تسعه رهط"],["15:82","H","Ils taillaient des maisons dans les montagnes.","من الجبال بيوتا"]]},{"id":"r-ibrahim","p":"recits","fr":"Ibrāhīm","ar":"إبراهيم","sfr":"Celui qui raisonne : contre son père, son peuple, le roi ; épreuve du fils ; construction de la Maison.","sar":"صاحب الحجة: مع أبيه وقومه والملك؛ ابتلاء الذبح؛ بناء البيت.","refs":[["6:74","H","À son père Āzar : « prends-tu des idoles pour dieux ? »","لابيه ازر"],["19:42-47","H","« Père, pourquoi adores-tu ce qui n'entend ni ne voit ? » Le père menace de le lapider ; Ibrāhīm : « paix sur toi ».","يابت"],["21:57-67","B","Il brise les idoles sauf la plus grande : « demandez-leur, si elles parlent ». Piège logique : ils admettent qu'elles ne parlent pas.","كبيرهم"],["21:68-70","H","« Brûlez-le ! » — « Feu, sois fraîcheur et paix sur Ibrāhīm. »","بردا وسلما"],["2:258","B","Débat avec un roi : « je donne la vie et la mort » ; « Dieu fait venir le soleil de l'Orient, fais-le venir de l'Occident ». Le roi est confondu.","فبهت"],["11:69-73","H","Visiteurs (anges) qui ne mangent pas ; annonce d'Isḥāq ; son épouse rit, puis s'étonne : « moi, vieille, et mon mari un vieillard ? »","ءالد"],["14:37","H","« J'ai établi une partie de ma descendance dans une vallée sans culture, près de Ta Maison sacrée. »","غير ذي زرع"],["2:127-129","H","Ibrāhīm et Ismāʿīl élèvent les fondations de la Maison.","القواعد"],["37:100-107","H","Le rêve du sacrifice ; le fils : « père, fais ce qui t'est ordonné » ; rachat par un sacrifice immense. Le fils n'est pas nommé dans ce passage.","بذبح عظيم"],["37:112","X","Après le récit du sacrifice, annonce d'Isḥāq : l'ordre du texte suggère que le fils du sacrifice est le premier (Ismāʿīl).","وبشرنه باسحق"],["4:125","D","Dieu a pris Ibrāhīm pour ami intime (khalīl).","خليلا"],["16:120","D","Ibrāhīm était une communauté (umma) à lui seul.","كان امه"]]},{"id":"r-lut","p":"recits","fr":"Lūṭ","ar":"لوط","sfr":"Neveu associé à Ibrāhīm, envoyé à une cité ; son épouse périt.","sar":"مرتبط بإبراهيم، أرسل إلى قرية؛ امرأته من الهالكين.","refs":[["29:26","H","Lūṭ crut en Ibrāhīm.","فامن له لوط"],["7:80-81","H","« Commettez-vous une turpitude que nul au monde n'a commise avant vous ? »","ما سبقكم"],["11:77-81","H","Les messagers arrivent ; son peuple accourt ; « n'y a-t-il pas parmi vous un homme sensé ? » ; sortir de nuit, sauf ton épouse.","رجل رشيد"],["11:82","H","Nous avons renversé la cité de fond en comble, pluie de pierres d'argile.","عليها سافلها"]]},{"id":"r-yusuf","p":"recits","fr":"Yūsuf","ar":"يوسف","sfr":"Le seul récit raconté d'un bloc dans une sourate entière : du rêve à la réalisation.","sar":"القصة الوحيدة المروية كاملة في سورة واحدة: من الرؤيا إلى تحققها.","refs":[["12:3","D","« Nous te racontons le plus beau des récits. »","احسن القصص"],["12:4-6","H","Rêve : onze astres, le soleil et la lune se prosternent ; Yaʿqūb : « ne le raconte pas à tes frères ».","احد عشر كوكبا"],["12:8-18","H","Jalousie des frères, le puits, la chemise tachée d'un faux sang ; Yaʿqūb : « belle patience ».","فصبر جميل"],["12:19-21","H","Une caravane le trouve et le vend pour quelques dirhams ; acheté en Égypte.","درهم معدوده"],["12:23-29","H","La femme du maître le sollicite ; la chemise déchirée par derrière prouve son innocence. Preuve matérielle.","من دبر"],["12:30-32","H","Les femmes de la ville se coupent les mains en le voyant.","وقطعن ايديهن"],["12:33","H","« La prison m'est préférable à ce à quoi elles m'invitent. »","السجن احب"],["12:36-42","H","En prison, il interprète deux rêves ; il prêche l'unicité à ses codétenus.","يصحبي السجن"],["12:43-49","H","Rêve du roi : sept vaches grasses et sept maigres ; plan économique de quinze ans.","سبع بقرت"],["12:51","H","La femme du maître avoue : « c'est moi qui l'ai sollicité ».","حصحص الحق"],["12:55","H","« Mets-moi sur les entrepôts de la terre : je suis gardien avisé. »","خزاين الارض"],["12:58-79","H","Les frères viennent sans le reconnaître ; il retient son frère par la coupe placée dans le sac.","السقايه"],["12:84","H","Yaʿqūb perd la vue de chagrin.","وابيضت عيناه"],["12:93-96","H","La chemise posée sur le visage du père : il recouvre la vue.","فارتد بصيرا"],["12:100","H","Parents élevés sur le trône, prosternation : « voici l'interprétation de mon rêve ».","تاويل رءيي"],["12:111","D","Dans leurs récits, une leçon pour les doués d'intelligence ; ce n'est pas un récit inventé.","عبره"]]},{"id":"r-shuayb","p":"recits","fr":"Shuʿayb et Madyan","ar":"شعيب ومدين","sfr":"Prophète de l'honnêteté commerciale.","sar":"نبي الأمانة في التجارة.","refs":[["7:85","E","Donnez la pleine mesure et le plein poids, ne lésez pas les gens dans leurs biens.","فاوفوا الكيل"],["11:87","H","« Ta prière t'ordonne-t-elle qu'on fasse de nos biens ce qu'on veut ? »","اصلوتك"],["11:88","D","« Je ne veux que réformer autant que je peux. »","الاصلح ما استطعت"],["26:176-189","H","Les gens de la forêt (al-ayka) et le jour de l'ombre.","ليكه"]]},{"id":"r-musa","p":"recits","fr":"Mūsā","ar":"موسى","sfr":"Le personnage le plus cité : naissance, fuite, appel, Pharaon, Exode, alliance, le veau, la vache, le maître de la science.","sar":"أكثر الشخصيات ذكرًا: الولادة، الفرار، النداء، فرعون، الخروج، الميثاق، العجل، البقرة، العبد الصالح.","refs":[["28:7","H","Inspiration à la mère : « allaite-le ; si tu crains pour lui, jette-le dans le fleuve ».","فالقيه في اليم"],["28:9","H","L'épouse de Pharaon : « fraîcheur d'œil pour moi et pour toi, ne le tuez pas ».","قرت عين"],["28:11-13","H","La sœur le suit ; il refuse les nourrices ; rendu à sa mère.","قصيه"],["28:15-21","H","Il frappe un Égyptien qui meurt ; fuite vers Madyan.","فوكزه"],["28:23-28","H","Abreuve le troupeau de deux femmes ; mariage contre huit ou dix ans de travail.","ثمني حجج"],["20:9-24","H","Le feu, la vallée sacrée Ṭuwā, « ôte tes sandales » ; bâton-serpent, main blanche.","طوي"],["20:25-36","H","« Ouvre-moi ma poitrine, délie le nœud de ma langue ; donne-moi Hārūn mon frère comme assistant. »","عقده من لساني"],["20:43-44","C","Allez vers Pharaon ; parlez-lui avec douceur (qawlan layyinan).","قولا لينا"],["26:18-22","H","Pharaon rappelle à Mūsā qu'il l'a élevé ; Mūsā : « tu as asservi les fils d'Isrāʾīl ».","عبدت بني اسريل"],["20:65-73","H","Les magiciens jettent cordes et bâtons ; le bâton avale ; les magiciens se prosternent malgré les menaces.","فالقي السحره"],["7:133","H","Inondation, sauterelles, poux, grenouilles, sang : signes détaillés.","الضفادع"],["26:61-66","H","« Nous allons être rattrapés ! » — « Non, mon Seigneur est avec moi. » Mer fendue, chaque partie comme une montagne.","كالطود"],["10:90-92","H","Pharaon, en se noyant, déclare croire ; « aujourd'hui Nous sauvons ton corps pour que tu sois un signe ».","ننجيك ببدنك"],["7:143","H","« Montre-Toi à moi » ; la montagne s'effondre ; Mūsā tombe foudroyé.","لن تريني"],["7:145","H","Les tables (alwāḥ) écrites.","الالواح"],["20:85-97","H","Al-Sāmirī fabrique un veau qui mugit ; Mūsā saisit Hārūn par la barbe ; Sāmirī condamné à dire « ne me touchez pas ».","السامري"],["2:67-71","H","« Dieu vous ordonne d'égorger une vache » ; questions successives qui compliquent l'ordre.","بقره"],["18:60-82","H","Mūsā suit un serviteur doté d'une science ; bateau troué, garçon tué, mur redressé, puis explication. Ce serviteur n'est pas nommé.","خرقها"],["28:76-82","H","Qārūn, de son peuple, aux clés trop lourdes ; « je l'ai obtenu par un savoir à moi » ; englouti avec sa maison.","قرون"],["40:28","H","Un homme croyant de la famille de Pharaon cachant sa foi : « tuerez-vous un homme parce qu'il dit : mon Seigneur est Dieu ? »","يكتم ايمنه"],["4:164","D","Dieu a parlé à Mūsā directement (kallama… taklīman).","تكليما"]]},{"id":"r-ayyub-yunus","p":"recits","fr":"Ayyūb et Yūnus","ar":"أيوب ويونس","sfr":"Deux épreuves : la maladie supportée, la fuite réparée.","sar":"ابتلاءان: المرض والصبر، والفرار والتوبة.","refs":[["21:83-84","H","Ayyūb : « le mal m'a touché, et Tu es le plus miséricordieux » ; guérison et famille rendue.","مسني الضر"],["38:41-44","H","Frappe du pied : une eau pour se laver et boire ; « nous l'avons trouvé patient ».","اركض برجلك"],["37:139-148","H","Yūnus s'enfuit vers le bateau chargé ; tiré au sort, avalé par le poisson ; s'il n'avait pas glorifié, il y serait resté.","الحوت"],["21:87-88","H","Dhū al-Nūn parti en colère ; dans les ténèbres : « pas de dieu sauf Toi, gloire à Toi, j'étais des injustes ».","ذا النون"],["10:98","X","Le peuple de Yūnus : seule cité qui crut avant le châtiment et fut épargnée.","قوم يونس"]]},{"id":"r-dawud-sulayman","p":"recits","fr":"Dāwūd et Sulaymān","ar":"داود وسليمان","sfr":"Père et fils, rois et prophètes : Goliath, le fer, les jinns, les animaux, la reine de Sabaʾ.","sar":"أب وابن، ملكان نبيان: جالوت، الحديد، الجن، الحيوان، ملكة سبأ.","refs":[["2:246-247","H","Les notables réclament un roi ; Ṭālūt choisi pour son savoir et sa force, malgré son manque de richesse.","طالوت"],["2:249","H","Épreuve de la rivière : ne pas boire sauf une poignée ; « combien de petits groupes ont vaincu de grands ».","فيه قليله"],["2:251","H","Dāwūd tua Jālūt ; Dieu lui donna royauté et sagesse.","جالوت"],["34:10-11","H","Montagnes et oiseaux reprennent ses louanges ; le fer amolli pour lui ; cottes de mailles.","والنا له الحديد"],["38:21-25","H","Deux plaideurs escaladent le sanctuaire : 99 brebis contre une ; Dāwūd comprend qu'il est éprouvé et se repent.","تسع وتسعون"],["38:26","E","Dāwūd, Nous t'avons fait successeur sur terre : juge avec vérité, ne suis pas la passion.","يداود"],["21:78-79","H","Jugement du champ ravagé par des moutons : Nous l'avons fait comprendre à Sulaymān.","ففهمنها"],["27:16","H","Sulaymān hérite de Dāwūd ; « on nous a appris le langage des oiseaux ».","منطق الطير"],["27:18-19","H","La fourmi avertit les siennes ; Sulaymān sourit.","نمله"],["27:20-28","H","La huppe absente rapporte : une femme règne sur Sabaʾ, ils se prosternent devant le soleil.","الهدهد"],["27:29-44","H","Lettre, cadeau refusé, trône apporté en un clin d'œil ; la reine prend le sol de verre pour de l'eau ; elle se soumet « avec Sulaymān ».","الصرح"],["34:12","H","Le vent soumis, une source de cuivre, des jinns qui travaillent.","عين القطر"],["38:35","H","« Donne-moi un royaume qui ne convienne à personne après moi. »","لا ينبغي لاحد"]]},{"id":"r-zakariya","p":"recits","fr":"Zakariyyā et Yaḥyā","ar":"زكريا ويحيى","sfr":"Prière d'un vieillard, naissance d'un fils au nom inédit.","sar":"دعاء شيخ كبير، وولادة ابن باسم لم يسبق.","refs":[["19:2-6","H","Prière secrète : « mes os se sont affaiblis, ma tête s'est enflammée de blancheur ».","واشتعل الراس شيبا"],["19:7","H","Annonce d'un garçon nommé Yaḥyā, nom jamais donné auparavant.","لم نجعل له من قبل سميا"],["19:10-11","H","Signe : ne pas parler aux gens trois nuits.","ثلث ليال"],["19:12-15","H","Yaḥyā : « prends le Livre avec force » ; reçoit la sagesse enfant ; bon envers ses parents.","بقوه"],["3:37","H","Zakariyyā trouve des provisions auprès de Maryam : « d'où cela te vient-il ? »","اني لك هذا"]]},{"id":"r-maryam","p":"recits","fr":"Maryam","ar":"مريم","sfr":"Seule femme nommée dans le texte ; une sourate porte son nom.","sar":"المرأة الوحيدة المسمّاة في النص؛ سورة تحمل اسمها.","refs":[["3:35-36","H","La femme de ʿImrān voue ce qu'elle porte ; « le garçon n'est pas comme la fille » ; elle la nomme Maryam.","امرات عمرن"],["3:42","D","Dieu t'a choisie et purifiée, choisie sur les femmes des mondes.","نسا العلمين"],["19:16-21","H","Elle se retire ; l'Esprit lui apparaît sous forme humaine ; « comment aurais-je un garçon, aucun humain ne m'a touchée ? »","بشرا سويا"],["19:23-26","H","Douleurs au pied d'un palmier ; « secoue le tronc, il fera tomber des dattes fraîches » ; vœu de silence.","جذع النخله"],["19:27-29","H","« Sœur de Hārūn, ton père n'était pas mauvais » ; elle désigne l'enfant.","ياخت هرون"],["66:12","D","Maryam fille de ʿImrān, qui préserva sa chasteté : exemple pour les croyants.","ابنت عمرن"]]},{"id":"r-isa","p":"recits","fr":"ʿĪsā (Jésus)","ar":"عيسى","sfr":"Le Messie, fils de Maryam : parole de Dieu, signes, négation de la divinité et de la crucifixion.","sar":"المسيح ابن مريم: كلمة الله، الآيات، نفي الألوهية والصلب.","refs":[["19:30-33","H","Le bébé parle : « je suis serviteur de Dieu ; Il m'a donné le Livre ; paix sur moi le jour où je suis né, où je mourrai, où je serai ressuscité ».","اني عبد الله"],["3:45","D","Une parole (kalima) venant de Lui, nommée le Messie ʿĪsā fils de Maryam.","بكلمه منه"],["3:49","H","Oiseau d'argile animé, guérison de l'aveugle et du lépreux, morts ranimés, « par la permission de Dieu ».","الاكمه"],["5:112-115","H","Les apôtres demandent une table servie descendue du ciel.","مايده"],["4:157-158","D","Ils ne l'ont ni tué ni crucifié, mais cela leur a semblé (shubbiha lahum) ; Dieu l'a élevé vers Lui.","شبه لهم"],["5:116-117","H","Dialogue au jugement : « as-tu dit aux gens : prenez-moi avec ma mère pour dieux ? » — « je ne leur ai dit que ce que Tu m'as ordonné ».","اتخذوني وامي"],["4:171","E","N'exagérez pas dans votre religion ; ne dites pas « trois ».","ثلثه"],["5:75","B","Le Messie et sa mère mangeaient de la nourriture : argument d'humanité.","ياكلان الطعام"],["61:6","H","ʿĪsā annonce un messager après lui nommé Aḥmad.","احمد"]]},{"id":"r-caverne","p":"recits","fr":"Les gens de la caverne","ar":"أصحاب الكهف","sfr":"Des jeunes qui fuient pour leur foi et dorment des siècles. Le texte laisse leur nombre ouvert.","sar":"فتية فرّوا بدينهم وناموا قرونًا. النص يترك عددهم مفتوحًا.","refs":[["18:13-16","H","Des jeunes qui crurent ; ils se réfugient dans la caverne.","فتيه"],["18:17-18","H","Le soleil s'écarte de leur caverne ; on les croirait éveillés ; leur chien étend ses pattes à l'entrée.","بسط ذراعيه"],["18:19-20","H","Réveillés, ils croient avoir dormi un jour ; l'un part acheter de la nourriture avec leur monnaie.","بورقكم"],["18:22","X","Trois, cinq, six ou sept avec leur chien : « mon Seigneur connaît mieux leur nombre ». Le texte refuse de trancher.","سبعه وثامنهم"],["18:25","D","Trois cents ans, et ils en ajoutèrent neuf (écart années solaires/lunaires possible).","ثلث مايه سنين"]]},{"id":"r-dhulqarnayn","p":"recits","fr":"Dhū al-Qarnayn","ar":"ذو القرنين","sfr":"Un souverain qui parcourt l'Occident, l'Orient, et construit un barrage.","sar":"ملك جاب المغرب والمشرق وبنى السد.","refs":[["18:83-84","H","On t'interroge sur Dhū al-Qarnayn : Nous lui avons donné des moyens en toute chose.","ذي القرنين"],["18:86","H","Au couchant du soleil, il le trouve se coucher dans une source boueuse : description de ce qu'il voyait (wajadahā).","عين حميه"],["18:90","H","Au levant, un peuple sans abri contre le soleil.","مطلع الشمس"],["18:94-97","H","Barrage de fer et de cuivre fondu contre Yaʾjūj et Maʾjūj.","قطرا"],["18:98","D","Quand la promesse viendra, Il le réduira en poussière.","دكا"]]},{"id":"r-luqman","p":"recits","fr":"Luqmān","ar":"لقمان","sfr":"Un sage non prophète, conseils d'un père à son fils.","sar":"حكيم غير نبي، وصايا أب لابنه.","refs":[["31:12","D","Nous avons donné à Luqmān la sagesse.","لقمن الحكمه"],["31:16-17","C","Même le poids d'une graine de moutarde, Dieu le fera venir ; accomplis la prière, ordonne le bien.","حبه من خردل"]]},{"id":"r-autres","p":"recits","fr":"Autres prophètes et figures","ar":"أنبياء وشخصيات أخرى","sfr":"Idrīs, Ilyās, al-Yasaʿ, Dhū al-Kifl, ʿUzayr, et la liste des messagers.","sar":"إدريس وإلياس واليسع وذو الكفل وعزير وقائمة الرسل.","refs":[["19:56-57","D","Idrīs, véridique, élevé à un haut rang.","ادريس"],["37:123-126","H","Ilyās : « invoquez-vous Baʿl ? »","بعلا"],["38:48","D","Ismāʿīl, al-Yasaʿ, Dhū al-Kifl : parmi les meilleurs.","واليسع"],["6:83-86","D","Liste : Isḥāq, Yaʿqūb, Nūḥ, Dāwūd, Sulaymān, Ayyūb, Yūsuf, Mūsā, Hārūn, Zakariyyā, Yaḥyā, ʿĪsā, Ilyās, Ismāʿīl, al-Yasaʿ, Yūnus, Lūṭ.","واليسع"],["3:33","D","Dieu a élu Adam, Nūḥ, la famille d'Ibrāhīm et la famille de ʿImrān.","وال عمرن"]]},{"id":"r-muhammad","p":"recits","fr":"Muḥammad","ar":"محمد","sfr":"Le destinataire du texte : nommé quatre fois, interpellé directement, parfois repris.","sar":"المخاطَب بالنص: ذُكر اسمه أربع مرات، يُخاطَب مباشرة، ويُعاتَب أحيانًا.","refs":[["3:144","D","Muḥammad n'est qu'un messager ; s'il mourait ou était tué, retourneriez-vous sur vos talons ?","وما محمد"],["48:29","D","Muḥammad, messager de Dieu ; ceux qui sont avec lui : durs envers les dénégateurs, miséricordieux entre eux.","محمد رسول الله"],["47:2","D","Ceux qui croient à ce qui est descendu sur Muḥammad.","علي محمد"],["68:4","D","Tu es d'une moralité immense.","خلق عظيم"],["21:107","D","Envoyé seulement comme miséricorde pour les mondes.","رحمه للعلمين"],["93:6-8","H","Ne t'a-t-Il pas trouvé orphelin et abrité, égaré et guidé, pauvre et enrichi ?","يتيما فاوي"],["96:1-5","H","Première injonction : lis, au nom de ton Seigneur.","علم بالقلم"],["17:1","H","Voyage nocturne de la Mosquée sacrée à la Mosquée lointaine (al-aqṣā).","الاقصا"],["53:1-18","H","Il l'a vu à deux arcs de distance ou plus près, près du jujubier de la limite.","سدره المنتهي"],["80
