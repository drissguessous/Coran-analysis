َّتَيۡهِمۡ جَنَّتَيۡنِ ذَوَاتَيۡ أُكُلٍ خَمۡطٖ وَأَثۡلٖ وَشَيۡءٖ مِّن سِدۡرٖ قَلِيلٖ","34:17":"ذَٰلِكَ جَزَيۡنَٰهُم بِمَا كَفَرُواْۖ وَهَلۡ نُجَٰزِيٓ إِلَّا ٱلۡكَفُورَ","35:1":"ٱلۡحَمۡدُ لِلَّهِ فَاطِرِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ جَاعِلِ ٱلۡمَلَـٰٓئِكَةِ رُسُلًا أُوْلِيٓ أَجۡنِحَةٖ مَّثۡنَىٰ وَثُلَٰثَ وَرُبَٰعَۚ يَزِيدُ فِي ٱلۡخَلۡقِ مَا يَشَآءُۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ","35:6":"إِنَّ ٱلشَّيۡطَٰنَ لَكُمۡ عَدُوّٞ فَٱتَّخِذُوهُ عَدُوًّاۚ إِنَّمَا يَدۡعُواْ حِزۡبَهُۥ لِيَكُونُواْ مِنۡ أَصۡحَٰبِ ٱلسَّعِيرِ","36:13":"وَٱضۡرِبۡ لَهُم مَّثَلًا أَصۡحَٰبَ ٱلۡقَرۡيَةِ إِذۡ جَآءَهَا ٱلۡمُرۡسَلُونَ","36:14":"إِذۡ أَرۡسَلۡنَآ إِلَيۡهِمُ ٱثۡنَيۡنِ فَكَذَّبُوهُمَا فَعَزَّزۡنَا بِثَالِثٖ فَقَالُوٓاْ إِنَّآ إِلَيۡكُم مُّرۡسَلُونَ","36:15":"قَالُواْ مَآ أَنتُمۡ إِلَّا بَشَرٞ مِّثۡلُنَا وَمَآ أَنزَلَ ٱلرَّحۡمَٰنُ مِن شَيۡءٍ إِنۡ أَنتُمۡ إِلَّا تَكۡذِبُونَ","36:16":"قَالُواْ رَبُّنَا يَعۡلَمُ إِنَّآ إِلَيۡكُمۡ لَمُرۡسَلُونَ","36:17":"وَمَا عَلَيۡنَآ إِلَّا ٱلۡبَلَٰغُ ٱلۡمُبِينُ","36:18":"قَالُوٓاْ إِنَّا تَطَيَّرۡنَا بِكُمۡۖ لَئِن لَّمۡ تَنتَهُواْ لَنَرۡجُمَنَّكُمۡ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٞ","36:19":"قَالُواْ طَـٰٓئِرُكُم مَّعَكُمۡ أَئِن ذُكِّرۡتُمۚ بَلۡ أَنتُمۡ قَوۡمٞ مُّسۡرِفُونَ","36:20":"وَجَآءَ مِنۡ أَقۡصَا ٱلۡمَدِينَةِ رَجُلٞ يَسۡعَىٰ قَالَ يَٰقَوۡمِ ٱتَّبِعُواْ ٱلۡمُرۡسَلِينَ","36:21":"ٱتَّبِعُواْ مَن لَّا يَسۡـَٔلُكُمۡ أَجۡرٗا وَهُم مُّهۡتَدُونَ","36:22":"وَمَالِيَ لَآ أَعۡبُدُ ٱلَّذِي فَطَرَنِي وَإِلَيۡهِ تُرۡجَعُونَ","36:23":"ءَأَتَّخِذُ مِن دُونِهِۦٓ ءَالِهَةً إِن يُرِدۡنِ ٱلرَّحۡمَٰنُ بِضُرّٖ لَّا تُغۡنِ عَنِّي شَفَٰعَتُهُمۡ شَيۡـٔٗا وَلَا يُنقِذُونِ","36:24":"إِنِّيٓ إِذٗا لَّفِي ضَلَٰلٖ مُّبِينٍ","36:25":"إِنِّيٓ ءَامَنتُ بِرَبِّكُمۡ فَٱسۡمَعُونِ","36:26":"قِيلَ ٱدۡخُلِ ٱلۡجَنَّةَۖ قَالَ يَٰلَيۡتَ قَوۡمِي يَعۡلَمُونَ","36:27":"بِمَا غَفَرَ لِي رَبِّي وَجَعَلَنِي مِنَ ٱلۡمُكۡرَمِينَ","36:28":"۞وَمَآ أَنزَلۡنَا عَلَىٰ قَوۡمِهِۦ مِنۢ بَعۡدِهِۦ مِن جُندٖ مِّنَ ٱلسَّمَآءِ وَمَا كُنَّا مُنزِلِينَ","36:29":"إِن كَانَتۡ إِلَّا صَيۡحَةٗ وَٰحِدَةٗ فَإِذَا هُمۡ خَٰمِدُونَ","36:36":"سُبۡحَٰنَ ٱلَّذِي خَلَقَ ٱلۡأَزۡوَٰجَ كُلَّهَا مِمَّا تُنۢبِتُ ٱلۡأَرۡضُ وَمِنۡ أَنفُسِهِمۡ وَمِمَّا لَا يَعۡلَمُونَ","36:38":"وَٱلشَّمۡسُ تَجۡرِي لِمُسۡتَقَرّٖ لَّهَاۚ ذَٰلِكَ تَقۡدِيرُ ٱلۡعَزِيزِ ٱلۡعَلِيمِ","36:39":"وَٱلۡقَمَرَ قَدَّرۡنَٰهُ مَنَازِلَ حَتَّىٰ عَادَ كَٱلۡعُرۡجُونِ ٱلۡقَدِيمِ","36:40":"لَا ٱلشَّمۡسُ يَنۢبَغِي لَهَآ أَن تُدۡرِكَ ٱلۡقَمَرَ وَلَا ٱلَّيۡلُ سَابِقُ ٱلنَّهَارِۚ وَكُلّٞ فِي فَلَكٖ يَسۡبَحُونَ","36:51":"وَنُفِخَ فِي ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلۡأَجۡدَاثِ إِلَىٰ رَبِّهِمۡ يَنسِلُونَ","36:52":"قَالُواْ يَٰوَيۡلَنَا مَنۢ بَعَثَنَا مِن مَّرۡقَدِنَاۜۗ هَٰذَا مَا وَعَدَ ٱلرَّحۡمَٰنُ وَصَدَقَ ٱلۡمُرۡسَلُونَ","36:53":"إِن كَانَتۡ إِلَّا صَيۡحَةٗ وَٰحِدَةٗ فَإِذَا هُمۡ جَمِيعٞ لَّدَيۡنَا مُحۡضَرُونَ","36:65":"ٱلۡيَوۡمَ نَخۡتِمُ عَلَىٰٓ أَفۡوَٰهِهِمۡ وَتُكَلِّمُنَآ أَيۡدِيهِمۡ وَتَشۡهَدُ أَرۡجُلُهُم بِمَا كَانُواْ يَكۡسِبُونَ","36:78":"وَضَرَبَ لَنَا مَثَلٗا وَنَسِيَ خَلۡقَهُۥۖ قَالَ مَن يُحۡيِ ٱلۡعِظَٰمَ وَهِيَ رَمِيمٞ","36:79":"قُلۡ يُحۡيِيهَا ٱلَّذِيٓ أَنشَأَهَآ أَوَّلَ مَرَّةٖۖ وَهُوَ بِكُلِّ خَلۡقٍ عَلِيمٌ","36:81":"أَوَلَيۡسَ ٱلَّذِي خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ بِقَٰدِرٍ عَلَىٰٓ أَن يَخۡلُقَ مِثۡلَهُمۚ بَلَىٰ وَهُوَ ٱلۡخَلَّـٰقُ ٱلۡعَلِيمُ","36:82":"إِنَّمَآ أَمۡرُهُۥٓ إِذَآ أَرَادَ شَيۡـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ","37:100":"رَبِّ هَبۡ لِي مِنَ ٱلصَّـٰلِحِينَ","37:101":"فَبَشَّرۡنَٰهُ بِغُلَٰمٍ حَلِيمٖ","37:102":"فَلَمَّا بَلَغَ مَعَهُ ٱلسَّعۡيَ قَالَ يَٰبُنَيَّ إِنِّيٓ أَرَىٰ فِي ٱلۡمَنَامِ أَنِّيٓ أَذۡبَحُكَ فَٱنظُرۡ مَاذَا تَرَىٰۚ قَالَ يَـٰٓأَبَتِ ٱفۡعَلۡ مَا تُؤۡمَرُۖ سَتَجِدُنِيٓ إِن شَآءَ ٱللَّهُ مِنَ ٱلصَّـٰبِرِينَ","37:103":"فَلَمَّآ أَسۡلَمَا وَتَلَّهُۥ لِلۡجَبِينِ","37:104":"وَنَٰدَيۡنَٰهُ أَن يَـٰٓإِبۡرَٰهِيمُ","37:105":"قَدۡ صَدَّقۡتَ ٱلرُّءۡيَآۚ إِنَّا كَذَٰلِكَ نَجۡزِي ٱلۡمُحۡسِنِينَ","37:106":"إِنَّ هَٰذَا لَهُوَ ٱلۡبَلَـٰٓؤُاْ ٱلۡمُبِينُ","37:107":"وَفَدَيۡنَٰهُ بِذِبۡحٍ عَظِيمٖ","37:112":"وَبَشَّرۡنَٰهُ بِإِسۡحَٰقَ نَبِيّٗا مِّنَ ٱلصَّـٰلِحِينَ","37:123":"وَإِنَّ إِلۡيَاسَ لَمِنَ ٱلۡمُرۡسَلِينَ","37:124":"إِذۡ قَالَ لِقَوۡمِهِۦٓ أَلَا تَتَّقُونَ","37:125":"أَتَدۡعُونَ بَعۡلٗا وَتَذَرُونَ أَحۡسَنَ ٱلۡخَٰلِقِينَ","37:126":"ٱللَّهَ رَبَّكُمۡ وَرَبَّ ءَابَآئِكُمُ ٱلۡأَوَّلِينَ","37:139":"وَإِنَّ يُونُسَ لَمِنَ ٱلۡمُرۡسَلِينَ","37:140":"إِذۡ أَبَقَ إِلَى ٱلۡفُلۡكِ ٱلۡمَشۡحُونِ","37:141":"فَسَاهَمَ فَكَانَ مِنَ ٱلۡمُدۡحَضِينَ","37:142":"فَٱلۡتَقَمَهُ ٱلۡحُوتُ وَهُوَ مُلِيمٞ","37:143":"فَلَوۡلَآ أَنَّهُۥ كَانَ مِنَ ٱلۡمُسَبِّحِينَ","37:144":"لَلَبِثَ فِي بَطۡنِهِۦٓ إِلَىٰ يَوۡمِ يُبۡعَثُونَ","37:145":"۞فَنَبَذۡنَٰهُ بِٱلۡعَرَآءِ وَهُوَ سَقِيمٞ","37:146":"وَأَنۢبَتۡنَا عَلَيۡهِ شَجَرَةٗ مِّن يَقۡطِينٖ","37:147":"وَأَرۡسَلۡنَٰهُ إِلَىٰ مِاْئَةِ أَلۡفٍ أَوۡ يَزِيدُونَ","37:148":"فَـَٔامَنُواْ فَمَتَّعۡنَٰهُمۡ إِلَىٰ حِينٖ","38:21":"۞وَهَلۡ أَتَىٰكَ نَبَؤُاْ ٱلۡخَصۡمِ إِذۡ تَسَوَّرُواْ ٱلۡمِحۡرَابَ","38:22":"إِذۡ دَخَلُواْ عَلَىٰ دَاوُۥدَ فَفَزِعَ مِنۡهُمۡۖ قَالُواْ لَا تَخَفۡۖ خَصۡمَانِ بَغَىٰ بَعۡضُنَا عَلَىٰ بَعۡضٖ فَٱحۡكُم بَيۡنَنَا بِٱلۡحَقِّ وَلَا تُشۡطِطۡ وَٱهۡدِنَآ إِلَىٰ سَوَآءِ ٱلصِّرَٰطِ","38:23":"إِنَّ هَٰذَآ أَخِي لَهُۥ تِسۡعٞ وَتِسۡعُونَ نَعۡجَةٗ وَلِيَ نَعۡجَةٞ وَٰحِدَةٞ فَقَالَ أَكۡفِلۡنِيهَا وَعَزَّنِي فِي ٱلۡخِطَابِ","38:24":"قَالَ لَقَدۡ ظَلَمَكَ بِسُؤَالِ نَعۡجَتِكَ إِلَىٰ نِعَاجِهِۦۖ وَإِنَّ كَثِيرٗا مِّنَ ٱلۡخُلَطَآءِ لَيَبۡغِي بَعۡضُهُمۡ عَلَىٰ بَعۡضٍ إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَقَلِيلٞ مَّا هُمۡۗ وَظَنَّ دَاوُۥدُ أَنَّمَا فَتَنَّـٰهُ فَٱسۡتَغۡفَرَ رَبَّهُۥ وَخَرَّۤ رَاكِعٗاۤ وَأَنَابَ۩","38:25":"فَغَفَرۡنَا لَهُۥ ذَٰلِكَۖ وَإِنَّ لَهُۥ عِندَنَا لَزُلۡفَىٰ وَحُسۡنَ مَـَٔابٖ","38:26":"يَٰدَاوُۥدُ إِنَّا جَعَلۡنَٰكَ خَلِيفَةٗ فِي ٱلۡأَرۡضِ فَٱحۡكُم بَيۡنَ ٱلنَّاسِ بِٱلۡحَقِّ وَلَا تَتَّبِعِ ٱلۡهَوَىٰ فَيُضِلَّكَ عَن سَبِيلِ ٱللَّهِۚ إِنَّ ٱلَّذِينَ يَضِلُّونَ عَن سَبِيلِ ٱللَّهِ لَهُمۡ عَذَابٞ شَدِيدُۢ بِمَا نَسُواْ يَوۡمَ ٱلۡحِسَابِ","38:29":"كِتَٰبٌ أَنزَلۡنَٰهُ إِلَيۡكَ مُبَٰرَكٞ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُوْلُواْ ٱلۡأَلۡبَٰبِ","38:30":"وَوَهَبۡنَا لِدَاوُۥدَ سُلَيۡمَٰنَۚ نِعۡمَ ٱلۡعَبۡدُ إِنَّهُۥٓ أَوَّابٌ","38:35":"قَالَ رَبِّ ٱغۡفِرۡ لِي وَهَبۡ لِي مُلۡكٗا لَّا يَنۢبَغِي لِأَحَدٖ مِّنۢ بَعۡدِيٓۖ إِنَّكَ أَنتَ ٱلۡوَهَّابُ","38:41":"وَٱذۡكُرۡ عَبۡدَنَآ أَيُّوبَ إِذۡ نَادَىٰ رَبَّهُۥٓ أَنِّي مَسَّنِيَ ٱلشَّيۡطَٰنُ بِنُصۡبٖ وَعَذَابٍ","38:42":"ٱرۡكُضۡ بِرِجۡلِكَۖ هَٰذَا مُغۡتَسَلُۢ بَارِدٞ وَشَرَابٞ","38:43":"وَوَهَبۡنَا لَهُۥٓ أَهۡلَهُۥ وَمِثۡلَهُم مَّعَهُمۡ رَحۡمَةٗ مِّنَّا وَذِكۡرَىٰ لِأُوْلِي ٱلۡأَلۡبَٰبِ","38:44":"وَخُذۡ بِيَدِكَ ضِغۡثٗا فَٱضۡرِب بِّهِۦ وَلَا تَحۡنَثۡۗ إِنَّا وَجَدۡنَٰهُ صَابِرٗاۚ نِّعۡمَ ٱلۡعَبۡدُ إِنَّهُۥٓ أَوَّابٞ","38:48":"وَٱذۡكُرۡ إِسۡمَٰعِيلَ وَٱلۡيَسَعَ وَذَا ٱلۡكِفۡلِۖ وَكُلّٞ مِّنَ ٱلۡأَخۡيَارِ","39:5":"خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ بِٱلۡحَقِّۖ يُكَوِّرُ ٱلَّيۡلَ عَلَى ٱلنَّهَارِ وَيُكَوِّرُ ٱلنَّهَارَ عَلَى ٱلَّيۡلِۖ وَسَخَّرَ ٱلشَّمۡسَ وَٱلۡقَمَرَۖ كُلّٞ يَجۡرِي لِأَجَلٖ مُّسَمًّىۗ أَلَا هُوَ ٱلۡعَزِيزُ ٱلۡغَفَّـٰرُ","39:6":"خَلَقَكُم مِّن نَّفۡسٖ وَٰحِدَةٖ ثُمَّ جَعَلَ مِنۡهَا زَوۡجَهَا وَأَنزَلَ لَكُم مِّنَ ٱلۡأَنۡعَٰمِ ثَمَٰنِيَةَ أَزۡوَٰجٖۚ يَخۡلُقُكُمۡ فِي بُطُونِ أُمَّهَٰتِكُمۡ خَلۡقٗا مِّنۢ بَعۡدِ خَلۡقٖ فِي ظُلُمَٰتٖ ثَلَٰثٖۚ ذَٰلِكُمُ ٱللَّهُ رَبُّكُمۡ لَهُ ٱلۡمُلۡكُۖ لَآ إِلَٰهَ إِلَّا هُوَۖ فَأَنَّىٰ تُصۡرَفُونَ","39:23":"ٱللَّهُ نَزَّلَ أَحۡسَنَ ٱلۡحَدِيثِ كِتَٰبٗا مُّتَشَٰبِهٗا مَّثَانِيَ تَقۡشَعِرُّ مِنۡهُ جُلُودُ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُمۡ ثُمَّ تَلِينُ جُلُودُهُمۡ وَقُلُوبُهُمۡ إِلَىٰ ذِكۡرِ ٱللَّهِۚ ذَٰلِكَ هُدَى ٱللَّهِ يَهۡدِي بِهِۦ مَن يَشَآءُۚ وَمَن يُضۡلِلِ ٱللَّهُ فَمَا لَهُۥ مِنۡ هَادٍ","39:29":"ضَرَبَ ٱللَّهُ مَثَلٗا رَّجُلٗا فِيهِ شُرَكَآءُ مُتَشَٰكِسُونَ وَرَجُلٗا سَلَمٗا لِّرَجُلٍ هَلۡ يَسۡتَوِيَانِ مَثَلًاۚ ٱلۡحَمۡدُ لِلَّهِۚ بَلۡ أَكۡثَرُهُمۡ لَا يَعۡلَمُونَ","39:42":"ٱللَّهُ يَتَوَفَّى ٱلۡأَنفُسَ حِينَ مَوۡتِهَا وَٱلَّتِي لَمۡ تَمُتۡ فِي مَنَامِهَاۖ فَيُمۡسِكُ ٱلَّتِي قَضَىٰ عَلَيۡهَا ٱلۡمَوۡتَ وَيُرۡسِلُ ٱلۡأُخۡرَىٰٓ إِلَىٰٓ أَجَلٖ مُّسَمًّىۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَفَكَّرُونَ","39:53":"۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ","40:28":"وَقَالَ رَجُلٞ مُّؤۡمِنٞ مِّنۡ ءَالِ فِرۡعَوۡنَ يَكۡتُمُ إِيمَٰنَهُۥٓ أَتَقۡتُلُونَ رَجُلًا أَن يَقُولَ رَبِّيَ ٱللَّهُ وَقَدۡ جَآءَكُم بِٱلۡبَيِّنَٰتِ مِن رَّبِّكُمۡۖ وَإِن يَكُ كَٰذِبٗا فَعَلَيۡهِ كَذِبُهُۥۖ وَإِن يَكُ صَادِقٗا يُصِبۡكُم بَعۡضُ ٱلَّذِي يَعِدُكُمۡۖ إِنَّ ٱللَّهَ لَا يَهۡدِي مَنۡ هُوَ مُسۡرِفٞ كَذَّابٞ","40:60":"وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ","40:78":"وَلَقَدۡ أَرۡسَلۡنَا رُسُلٗا مِّن قَبۡلِكَ مِنۡهُم مَّن قَصَصۡنَا عَلَيۡكَ وَمِنۡهُم مَّن لَّمۡ نَقۡصُصۡ عَلَيۡكَۗ وَمَا كَانَ لِرَسُولٍ أَن يَأۡتِيَ بِـَٔايَةٍ إِلَّا بِإِذۡنِ ٱللَّهِۚ فَإِذَا جَآءَ أَمۡرُ ٱللَّهِ قُضِيَ بِٱلۡحَقِّ وَخَسِرَ هُنَالِكَ ٱلۡمُبۡطِلُونَ","41:11":"ثُمَّ ٱسۡتَوَىٰٓ إِلَى ٱلسَّمَآءِ وَهِيَ دُخَانٞ فَقَالَ لَهَا وَلِلۡأَرۡضِ ٱئۡتِيَا طَوۡعًا أَوۡ كَرۡهٗا قَالَتَآ أَتَيۡنَا طَآئِعِينَ","41:15":"فَأَمَّا عَادٞ فَٱسۡتَكۡبَرُواْ فِي ٱلۡأَرۡضِ بِغَيۡرِ ٱلۡحَقِّ وَقَالُواْ مَنۡ أَشَدُّ مِنَّا قُوَّةًۖ أَوَلَمۡ يَرَوۡاْ أَنَّ ٱللَّهَ ٱلَّذِي خَلَقَهُمۡ هُوَ أَشَدُّ مِنۡهُمۡ قُوَّةٗۖ وَكَانُواْ بِـَٔايَٰتِنَا يَجۡحَدُونَ","41:20":"حَتَّىٰٓ إِذَا مَا جَآءُوهَا شَهِدَ عَلَيۡهِمۡ سَمۡعُهُمۡ وَأَبۡصَٰرُهُمۡ وَجُلُودُهُم بِمَا كَانُواْ يَعۡمَلُونَ","41:21":"وَقَالُواْ لِجُلُودِهِمۡ لِمَ شَهِدتُّمۡ عَلَيۡنَاۖ قَالُوٓاْ أَنطَقَنَا ٱللَّهُ ٱلَّذِيٓ أَنطَقَ كُلَّ شَيۡءٖۚ وَهُوَ خَلَقَكُمۡ أَوَّلَ مَرَّةٖ وَإِلَيۡهِ تُرۡجَعُونَ","41:34":"وَلَا تَسۡتَوِي ٱلۡحَسَنَةُ وَلَا ٱلسَّيِّئَةُۚ ٱدۡفَعۡ بِٱلَّتِي هِيَ أَحۡسَنُ فَإِذَا ٱلَّذِي بَيۡنَكَ وَبَيۡنَهُۥ عَدَٰوَةٞ كَأَنَّهُۥ وَلِيٌّ حَمِيمٞ","41:39":"وَمِنۡ ءَايَٰتِهِۦٓ أَنَّكَ تَرَى ٱلۡأَرۡضَ خَٰشِعَةٗ فَإِذَآ أَنزَلۡنَا عَلَيۡهَا ٱلۡمَآءَ ٱهۡتَزَّتۡ وَرَبَتۡۚ إِنَّ ٱلَّذِيٓ أَحۡيَاهَا لَمُحۡيِ ٱلۡمَوۡتَىٰٓۚ إِنَّهُۥ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٌ","41:53":"سَنُرِيهِمۡ ءَايَٰتِنَا فِي ٱلۡأٓفَاقِ وَفِيٓ أَنفُسِهِمۡ حَتَّىٰ يَتَبَيَّنَ لَهُمۡ أَنَّهُ ٱلۡحَقُّۗ أَوَلَمۡ يَكۡفِ بِرَبِّكَ أَنَّهُۥ عَلَىٰ كُلِّ شَيۡءٖ شَهِيدٌ","42:11":"فَاطِرُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ جَعَلَ لَكُم مِّنۡ أَنفُسِكُمۡ أَزۡوَٰجٗا وَمِنَ ٱلۡأَنۡعَٰمِ أَزۡوَٰجٗا يَذۡرَؤُكُمۡ فِيهِۚ لَيۡسَ كَمِثۡلِهِۦ شَيۡءٞۖ وَهُوَ ٱلسَّمِيعُ ٱلۡبَصِيرُ","42:38":"وَٱلَّذِينَ ٱسۡتَجَابُواْ لِرَبِّهِمۡ وَأَقَامُواْ ٱلصَّلَوٰةَ وَأَمۡرُهُمۡ شُورَىٰ بَيۡنَهُمۡ وَمِمَّا رَزَقۡنَٰهُمۡ يُنفِقُونَ","42:40":"وَجَزَـٰٓؤُاْ سَيِّئَةٖ سَيِّئَةٞ مِّثۡلُهَاۖ فَمَنۡ عَفَا وَأَصۡلَحَ فَأَجۡرُهُۥ عَلَى ٱللَّهِۚ إِنَّهُۥ لَا يُحِبُّ ٱلظَّـٰلِمِينَ","43:3":"إِنَّا جَعَلۡنَٰهُ قُرۡءَٰنًا عَرَبِيّٗا لَّعَلَّكُمۡ تَعۡقِلُونَ","43:77":"وَنَادَوۡاْ يَٰمَٰلِكُ لِيَقۡضِ عَلَيۡنَا رَبُّكَۖ قَالَ إِنَّكُم مَّـٰكِثُونَ","46:15":"وَوَصَّيۡنَا ٱلۡإِنسَٰنَ بِوَٰلِدَيۡهِ إِحۡسَٰنًاۖ حَمَلَتۡهُ أُمُّهُۥ كُرۡهٗا وَوَضَعَتۡهُ كُرۡهٗاۖ وَحَمۡلُهُۥ وَفِصَٰلُهُۥ ثَلَٰثُونَ شَهۡرًاۚ حَتَّىٰٓ إِذَا بَلَغَ أَشُدَّهُۥ وَبَلَغَ أَرۡبَعِينَ سَنَةٗ قَالَ رَبِّ أَوۡزِعۡنِيٓ أَنۡ أَشۡكُرَ نِعۡمَتَكَ ٱلَّتِيٓ أَنۡعَمۡتَ عَلَيَّ وَعَلَىٰ وَٰلِدَيَّ وَأَنۡ أَعۡمَلَ صَٰلِحٗا تَرۡضَىٰهُ وَأَصۡلِحۡ لِي فِي ذُرِّيَّتِيٓۖ إِنِّي تُبۡتُ إِلَيۡكَ وَإِنِّي مِنَ ٱلۡمُسۡلِمِينَ","46:24":"فَلَمَّا رَأَوۡهُ عَارِضٗا مُّسۡتَقۡبِلَ أَوۡدِيَتِهِمۡ قَالُواْ هَٰذَا عَارِضٞ مُّمۡطِرُنَاۚ بَلۡ هُوَ مَا ٱسۡتَعۡجَلۡتُم بِهِۦۖ رِيحٞ فِيهَا عَذَابٌ أَلِيمٞ","46:25":"تُدَمِّرُ كُلَّ شَيۡءِۭ بِأَمۡرِ رَبِّهَا فَأَصۡبَحُواْ لَا يُرَىٰٓ إِلَّا مَسَٰكِنُهُمۡۚ كَذَٰلِكَ نَجۡزِي ٱلۡقَوۡمَ ٱلۡمُجۡرِمِينَ","46:29":"وَإِذۡ صَرَفۡنَآ إِلَيۡكَ نَفَرٗا مِّنَ ٱلۡجِنِّ يَسۡتَمِعُونَ ٱلۡقُرۡءَانَ فَلَمَّا حَضَرُوهُ قَالُوٓاْ أَنصِتُواْۖ فَلَمَّا قُضِيَ وَلَّوۡاْ إِلَىٰ قَوۡمِهِم مُّنذِرِينَ","46:30":"قَالُواْ يَٰقَوۡمَنَآ إِنَّا سَمِعۡنَا كِتَٰبًا أُنزِلَ مِنۢ بَعۡدِ مُوسَىٰ مُصَدِّقٗا لِّمَا بَيۡنَ يَدَيۡهِ يَهۡدِيٓ إِلَى ٱلۡحَقِّ وَإِلَىٰ طَرِيقٖ مُّسۡتَقِيمٖ","46:31":"يَٰقَوۡمَنَآ أَجِيبُواْ دَاعِيَ ٱللَّهِ وَءَامِنُواْ بِهِۦ يَغۡفِرۡ لَكُم مِّن ذُنُوبِكُمۡ وَيُجِرۡكُم مِّنۡ عَذَابٍ أَلِيمٖ","47:2":"وَٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَءَامَنُواْ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٖ وَهُوَ ٱلۡحَقُّ مِن رَّبِّهِمۡ كَفَّرَ عَنۡهُمۡ سَيِّـَٔاتِهِمۡ وَأَصۡلَحَ بَالَهُمۡ","47:15":"مَّثَلُ ٱلۡجَنَّةِ ٱلَّتِي وُعِدَ ٱلۡمُتَّقُونَۖ فِيهَآ أَنۡهَٰرٞ مِّن مَّآءٍ غَيۡرِ ءَاسِنٖ وَأَنۡهَٰرٞ مِّن لَّبَنٖ لَّمۡ يَتَغَيَّرۡ طَعۡمُهُۥ وَأَنۡهَٰرٞ مِّنۡ خَمۡرٖ لَّذَّةٖ لِّلشَّـٰرِبِينَ وَأَنۡهَٰرٞ مِّنۡ عَسَلٖ مُّصَفّٗىۖ وَلَهُمۡ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَمَغۡفِرَةٞ مِّن رَّبِّهِمۡۖ كَمَنۡ هُوَ خَٰلِدٞ فِي ٱلنَّارِ وَسُقُواْ مَآءً حَمِيمٗا فَقَطَّعَ أَمۡعَآءَهُمۡ","47:24":"أَفَلَا يَتَدَبَّرُونَ ٱلۡقُرۡءَانَ أَمۡ عَلَىٰ قُلُوبٍ أَقۡفَالُهَآ","48:29":"مُّحَمَّدٞ رَّسُولُ ٱللَّهِۚ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلۡكُفَّارِ رُحَمَآءُ بَيۡنَهُمۡۖ تَرَىٰهُمۡ رُكَّعٗا سُجَّدٗا يَبۡتَغُونَ فَضۡلٗا مِّنَ ٱللَّهِ وَرِضۡوَٰنٗاۖ سِيمَاهُمۡ فِي وُجُوهِهِم مِّنۡ أَثَرِ ٱلسُّجُودِۚ ذَٰلِكَ مَثَلُهُمۡ فِي ٱلتَّوۡرَىٰةِۚ وَمَثَلُهُمۡ فِي ٱلۡإِنجِيلِ كَزَرۡعٍ أَخۡرَجَ شَطۡـَٔهُۥ فَـَٔازَرَهُۥ فَٱسۡتَغۡلَظَ فَٱسۡتَوَىٰ عَلَىٰ سُوقِهِۦ يُعۡجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلۡكُفَّارَۗ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ مِنۡهُم مَّغۡفِرَةٗ وَأَجۡرًا عَظِيمَۢا","49:6":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِن جَآءَكُمۡ فَاسِقُۢ بِنَبَإٖ فَتَبَيَّنُوٓاْ أَن تُصِيبُواْ قَوۡمَۢا بِجَهَٰلَةٖ فَتُصۡبِحُواْ عَلَىٰ مَا فَعَلۡتُمۡ نَٰدِمِينَ","49:9":"وَإِن طَآئِفَتَانِ مِنَ ٱلۡمُؤۡمِنِينَ ٱقۡتَتَلُواْ فَأَصۡلِحُواْ بَيۡنَهُمَاۖ فَإِنۢ بَغَتۡ إِحۡدَىٰهُمَا عَلَى ٱلۡأُخۡرَىٰ فَقَٰتِلُواْ ٱلَّتِي تَبۡغِي حَتَّىٰ تَفِيٓءَ إِلَىٰٓ أَمۡرِ ٱللَّهِۚ فَإِن فَآءَتۡ فَأَصۡلِحُواْ بَيۡنَهُمَا بِٱلۡعَدۡلِ وَأَقۡسِطُوٓاْۖ إِنَّ ٱللَّهَ يُحِبُّ ٱلۡمُقۡسِطِينَ","49:11":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لَا يَسۡخَرۡ قَوۡمٞ مِّن قَوۡمٍ عَسَىٰٓ أَن يَكُونُواْ خَيۡرٗا مِّنۡهُمۡ وَلَا نِسَآءٞ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيۡرٗا مِّنۡهُنَّۖ وَلَا تَلۡمِزُوٓاْ أَنفُسَكُمۡ وَلَا تَنَابَزُواْ بِٱلۡأَلۡقَٰبِۖ بِئۡسَ ٱلِٱسۡمُ ٱلۡفُسُوقُ بَعۡدَ ٱلۡإِيمَٰنِۚ وَمَن لَّمۡ يَتُبۡ فَأُوْلَـٰٓئِكَ هُمُ ٱلظَّـٰلِمُونَ","49:12":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱجۡتَنِبُواْ كَثِيرٗا مِّنَ ٱلظَّنِّ إِنَّ بَعۡضَ ٱلظَّنِّ إِثۡمٞۖ وَلَا تَجَسَّسُواْ وَلَا يَغۡتَب بَّعۡضُكُم بَعۡضًاۚ أَيُحِبُّ أَحَدُكُمۡ أَن يَأۡكُلَ لَحۡمَ أَخِيهِ مَيۡتٗا فَكَرِهۡتُمُوهُۚ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ تَوَّابٞ رَّحِيمٞ","49:13":"يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ","50:16":"وَلَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ وَنَعۡلَمُ مَا تُوَسۡوِسُ بِهِۦ نَفۡسُهُۥۖ وَنَحۡنُ أَقۡرَبُ إِلَيۡهِ مِنۡ حَبۡلِ ٱلۡوَرِيدِ","50:17":"إِذۡ يَتَلَقَّى ٱلۡمُتَلَقِّيَانِ عَنِ ٱلۡيَمِينِ وَعَنِ ٱلشِّمَالِ قَعِيدٞ","50:18":"مَّا يَلۡفِظُ مِن قَوۡلٍ إِلَّا لَدَيۡهِ رَقِيبٌ عَتِيدٞ","50:19":"وَجَآءَتۡ سَكۡرَةُ ٱلۡمَوۡتِ بِٱلۡحَقِّۖ ذَٰلِكَ مَا كُنتَ مِنۡهُ تَحِيدُ","51:20":"وَفِي ٱلۡأَرۡضِ ءَايَٰتٞ لِّلۡمُوقِنِينَ","51:21":"وَفِيٓ أَنفُسِكُمۡۚ أَفَلَا تُبۡصِرُونَ","51:47":"وَٱلسَّمَآءَ بَنَيۡنَٰهَا بِأَيۡيْدٖ وَإِنَّا لَمُوسِعُونَ","51:49":"وَمِن كُلِّ شَيۡءٍ خَلَقۡنَا زَوۡجَيۡنِ لَعَلَّكُمۡ تَذَكَّرُونَ","51:56":"وَمَا خَلَقۡتُ ٱلۡجِنَّ وَٱلۡإِنسَ إِلَّا لِيَعۡبُدُونِ","52:35":"أَمۡ خُلِقُواْ مِنۡ غَيۡرِ شَيۡءٍ أَمۡ هُمُ ٱلۡخَٰلِقُونَ","52:36":"أَمۡ خَلَقُواْ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۚ بَل لَّا يُوقِنُونَ","53:1":"وَٱلنَّجۡمِ إِذَا هَوَىٰ","53:2":"مَا ضَلَّ صَاحِبُكُمۡ وَمَا غَوَىٰ","53:3":"وَمَا يَنطِقُ عَنِ ٱلۡهَوَىٰٓ","53:4":"إِنۡ هُوَ إِلَّا وَحۡيٞ يُوحَىٰ","53:5":"عَلَّمَهُۥ شَدِيدُ ٱلۡقُوَىٰ","53:6":"ذُو مِرَّةٖ فَٱسۡتَوَىٰ","53:7":"وَهُوَ بِٱلۡأُفُقِ ٱلۡأَعۡلَىٰ","53:8":"ثُمَّ دَنَا فَتَدَلَّىٰ","53:9":"فَكَانَ قَابَ قَوۡسَيۡنِ أَوۡ أَدۡنَىٰ","53:10":"فَأَوۡحَىٰٓ إِلَىٰ عَبۡدِهِۦ مَآ أَوۡحَىٰ","53:11":"مَا كَذَبَ ٱلۡفُؤَادُ مَا رَأَىٰٓ","53:12":"أَفَتُمَٰرُونَهُۥ عَلَىٰ مَا يَرَىٰ","53:13":"وَلَقَدۡ رَءَاهُ نَزۡلَةً أُخۡرَىٰ","53:14":"عِندَ سِدۡرَةِ ٱلۡمُنتَهَىٰ","53:15":"عِندَهَا جَنَّةُ ٱلۡمَأۡوَىٰٓ","53:16":"إِذۡ يَغۡشَى ٱلسِّدۡرَةَ مَا يَغۡشَىٰ","53:17":"مَا زَاغَ ٱلۡبَصَرُ وَمَا طَغَىٰ","53:18":"لَقَدۡ رَأَىٰ مِنۡ ءَايَٰتِ رَبِّهِ ٱلۡكُبۡرَىٰٓ","53:19":"أَفَرَءَيۡتُمُ ٱللَّـٰتَ وَٱلۡعُزَّىٰ","53:20":"وَمَنَوٰةَ ٱلثَّالِثَةَ ٱلۡأُخۡرَىٰٓ","53:21":"أَلَكُمُ ٱلذَّكَرُ وَلَهُ ٱلۡأُنثَىٰ","53:22":"تِلۡكَ إِذٗا قِسۡمَةٞ ضِيزَىٰٓ","53:23":"إِنۡ هِيَ إِلَّآ أَسۡمَآءٞ سَمَّيۡتُمُوهَآ أَنتُمۡ وَءَابَآؤُكُم مَّآ أَنزَلَ ٱللَّهُ بِهَا مِن سُلۡطَٰنٍۚ إِن يَتَّبِعُونَ إِلَّا ٱلظَّنَّ وَمَا تَهۡوَى ٱلۡأَنفُسُۖ وَلَقَدۡ جَآءَهُم مِّن رَّبِّهِمُ ٱلۡهُدَىٰٓ","53:39":"وَأَن لَّيۡسَ لِلۡإِنسَٰنِ إِلَّا مَا سَعَىٰ","54:17":"وَلَقَدۡ يَسَّرۡنَا ٱلۡقُرۡءَانَ لِلذِّكۡرِ فَهَلۡ مِن مُّدَّكِرٖ","54:49":"إِنَّا كُلَّ شَيۡءٍ خَلَقۡنَٰهُ بِقَدَرٖ","55:5":"ٱلشَّمۡسُ وَٱلۡقَمَرُ بِحُسۡبَانٖ","55:7":"وَٱلسَّمَآءَ رَفَعَهَا وَوَضَعَ ٱلۡمِيزَانَ","55:8":"أَلَّا تَطۡغَوۡاْ فِي ٱلۡمِيزَانِ","55:9":"وَأَقِيمُواْ ٱلۡوَزۡنَ بِٱلۡقِسۡطِ وَلَا تُخۡسِرُواْ ٱلۡمِيزَانَ","55:15":"وَخَلَقَ ٱلۡجَآنَّ مِن مَّارِجٖ مِّن نَّارٖ","55:17":"رَبُّ ٱلۡمَشۡرِقَيۡنِ وَرَبُّ ٱلۡمَغۡرِبَيۡنِ","55:19":"مَرَجَ ٱلۡبَحۡرَيۡنِ يَلۡتَقِيَانِ","55:20":"بَيۡنَهُمَا بَرۡزَخٞ لَّا يَبۡغِيَانِ","55:33":"يَٰمَعۡشَرَ ٱلۡجِنِّ وَٱلۡإِنسِ إِنِ ٱسۡتَطَعۡتُمۡ أَن تَنفُذُواْ مِنۡ أَقۡطَارِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ فَٱنفُذُواْۚ لَا تَنفُذُونَ إِلَّا بِسُلۡطَٰنٖ","56:25":"لَا يَسۡمَعُونَ فِيهَا لَغۡوٗا وَلَا تَأۡثِيمًا","56:26":"إِلَّا قِيلٗا سَلَٰمٗا سَلَٰمٗا","57:3":"هُوَ ٱلۡأَوَّلُ وَٱلۡأٓخِرُ وَٱلظَّـٰهِرُ وَٱلۡبَاطِنُۖ وَهُوَ بِكُلِّ شَيۡءٍ عَلِيمٌ","57:20":"ٱعۡلَمُوٓاْ أَنَّمَا ٱلۡحَيَوٰةُ ٱلدُّنۡيَا لَعِبٞ وَلَهۡوٞ وَزِينَةٞ وَتَفَاخُرُۢ بَيۡنَكُمۡ وَتَكَاثُرٞ فِي ٱلۡأَمۡوَٰلِ وَٱلۡأَوۡلَٰدِۖ كَمَثَلِ غَيۡثٍ أَعۡجَبَ ٱلۡكُفَّارَ نَبَاتُهُۥ ثُمَّ يَهِيجُ فَتَرَىٰهُ مُصۡفَرّٗا ثُمَّ يَكُونُ حُطَٰمٗاۖ وَفِي ٱلۡأٓخِرَةِ عَذَابٞ شَدِيدٞ وَمَغۡفِرَةٞ مِّنَ ٱللَّهِ وَرِضۡوَٰنٞۚ وَمَا ٱلۡحَيَوٰةُ ٱلدُّنۡيَآ إِلَّا مَتَٰعُ ٱلۡغُرُورِ","57:22":"مَآ أَصَابَ مِن مُّصِيبَةٖ فِي ٱلۡأَرۡضِ وَلَا فِيٓ أَنفُسِكُمۡ إِلَّا فِي كِتَٰبٖ مِّن قَبۡلِ أَن نَّبۡرَأَهَآۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٞ","57:25":"لَقَدۡ أَرۡسَلۡنَا رُسُلَنَا بِٱلۡبَيِّنَٰتِ وَأَنزَلۡنَا مَعَهُمُ ٱلۡكِتَٰبَ وَٱلۡمِيزَانَ لِيَقُومَ ٱلنَّاسُ بِٱلۡقِسۡطِۖ وَأَنزَلۡنَا ٱلۡحَدِيدَ فِيهِ بَأۡسٞ شَدِيدٞ وَمَنَٰفِعُ لِلنَّاسِ وَلِيَعۡلَمَ ٱللَّهُ مَن يَنصُرُهُۥ وَرُسُلَهُۥ بِٱلۡغَيۡبِۚ إِنَّ ٱللَّهَ قَوِيٌّ عَزِيزٞ","57:26":"وَلَقَدۡ أَرۡسَلۡنَا نُوحٗا وَإِبۡرَٰهِيمَ وَجَعَلۡنَا فِي ذُرِّيَّتِهِمَا ٱلنُّبُوَّةَ وَٱلۡكِتَٰبَۖ فَمِنۡهُم مُّهۡتَدٖۖ وَكَثِيرٞ مِّنۡهُمۡ فَٰسِقُونَ","59:7":"مَّآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنۡ أَهۡلِ ٱلۡقُرَىٰ فَلِلَّهِ وَلِلرَّسُولِ وَلِذِي ٱلۡقُرۡبَىٰ وَٱلۡيَتَٰمَىٰ وَٱلۡمَسَٰكِينِ وَٱبۡنِ ٱلسَّبِيلِ كَيۡ لَا يَكُونَ دُولَةَۢ بَيۡنَ ٱلۡأَغۡنِيَآءِ مِنكُمۡۚ وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمۡ عَنۡهُ فَٱنتَهُواْۚ وَٱتَّقُواْ ٱللَّهَۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلۡعِقَابِ","59:22":"هُوَ ٱللَّهُ ٱلَّذِي لَآ إِلَٰهَ إِلَّا هُوَۖ عَٰلِمُ ٱلۡغَيۡبِ وَٱلشَّهَٰدَةِۖ هُوَ ٱلرَّحۡمَٰنُ ٱلرَّحِيمُ","59:23":"هُوَ ٱللَّهُ ٱلَّذِي لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡمَلِكُ ٱلۡقُدُّوسُ ٱلسَّلَٰمُ ٱلۡمُؤۡمِنُ ٱلۡمُهَيۡمِنُ ٱلۡعَزِيزُ ٱلۡجَبَّارُ ٱلۡمُتَكَبِّرُۚ سُبۡحَٰنَ ٱللَّهِ عَمَّا يُشۡرِكُونَ","59:24":"هُوَ ٱللَّهُ ٱلۡخَٰلِقُ ٱلۡبَارِئُ ٱلۡمُصَوِّرُۖ لَهُ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰۚ يُسَبِّحُ لَهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۖ وَهُوَ ٱلۡعَزِيزُ ٱلۡحَكِيمُ","60:8":"لَّا يَنۡهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمۡ يُقَٰتِلُوكُمۡ فِي ٱلدِّينِ وَلَمۡ يُخۡرِجُوكُم مِّن دِيَٰرِكُمۡ أَن تَبَرُّوهُمۡ وَتُقۡسِطُوٓاْ إِلَيۡهِمۡۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلۡمُقۡسِطِينَ","61:6":"وَإِذۡ قَالَ عِيسَى ٱبۡنُ مَرۡيَمَ يَٰبَنِيٓ إِسۡرَـٰٓءِيلَ إِنِّي رَسُولُ ٱللَّهِ إِلَيۡكُم مُّصَدِّقٗا لِّمَا بَيۡنَ يَدَيَّ مِنَ ٱلتَّوۡرَىٰةِ وَمُبَشِّرَۢا بِرَسُولٖ يَأۡتِي مِنۢ بَعۡدِي ٱسۡمُهُۥٓ أَحۡمَدُۖ فَلَمَّا جَآءَهُم بِٱلۡبَيِّنَٰتِ قَالُواْ هَٰذَا سِحۡرٞ مُّبِينٞ","62:5":"مَثَلُ ٱلَّذِينَ حُمِّلُواْ ٱلتَّوۡرَىٰةَ ثُمَّ لَمۡ يَحۡمِلُوهَا كَمَثَلِ ٱلۡحِمَارِ يَحۡمِلُ أَسۡفَارَۢاۚ بِئۡسَ مَثَلُ ٱلۡقَوۡمِ ٱلَّذِينَ كَذَّبُواْ بِـَٔايَٰتِ ٱللَّهِۚ وَٱللَّهُ لَا يَهۡدِي ٱلۡقَوۡمَ ٱلظَّـٰلِمِينَ","62:9":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِن يَوۡمِ ٱلۡجُمُعَةِ فَٱسۡعَوۡاْ إِلَىٰ ذِكۡرِ ٱللَّهِ وَذَرُواْ ٱلۡبَيۡعَۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ","63:10":"وَأَنفِقُواْ مِن مَّا رَزَقۡنَٰكُم مِّن قَبۡلِ أَن يَأۡتِيَ أَحَدَكُمُ ٱلۡمَوۡتُ فَيَقُولَ رَبِّ لَوۡلَآ أَخَّرۡتَنِيٓ إِلَىٰٓ أَجَلٖ قَرِيبٖ فَأَصَّدَّقَ وَأَكُن مِّنَ ٱلصَّـٰلِحِينَ","63:11":"وَلَن يُؤَخِّرَ ٱللَّهُ نَفۡسًا إِذَا جَآءَ أَجَلُهَاۚ وَٱللَّهُ خَبِيرُۢ بِمَا تَعۡمَلُونَ","65:1":"يَـٰٓأَيُّهَا ٱلنَّبِيُّ إِذَا طَلَّقۡتُمُ ٱلنِّسَآءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ وَأَحۡصُواْ ٱلۡعِدَّةَۖ وَٱتَّقُواْ ٱللَّهَ رَبَّكُمۡۖ لَا تُخۡرِجُوهُنَّ مِنۢ بُيُوتِهِنَّ وَلَا يَخۡرُجۡنَ إِلَّآ أَن يَأۡتِينَ بِفَٰحِشَةٖ مُّبَيِّنَةٖۚ وَتِلۡكَ حُدُودُ ٱللَّهِۚ وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَقَدۡ ظَلَمَ نَفۡسَهُۥۚ لَا تَدۡرِي لَعَلَّ ٱللَّهَ يُحۡدِثُ بَعۡدَ ذَٰلِكَ أَمۡرٗا","65:12":"ٱللَّهُ ٱلَّذِي خَلَقَ سَبۡعَ سَمَٰوَٰتٖ وَمِنَ ٱلۡأَرۡضِ مِثۡلَهُنَّۖ يَتَنَزَّلُ ٱلۡأَمۡرُ بَيۡنَهُنَّ لِتَعۡلَمُوٓاْ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ وَأَنَّ ٱللَّهَ قَدۡ أَحَاطَ بِكُلِّ شَيۡءٍ عِلۡمَۢا","66:6":"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ قُوٓاْ أَنفُسَكُمۡ وَأَهۡلِيكُمۡ نَارٗا وَقُودُهَا ٱلنَّاسُ وَٱلۡحِجَارَةُ عَلَيۡهَا مَلَـٰٓئِكَةٌ غِلَاظٞ شِدَادٞ لَّا يَعۡصُونَ ٱللَّهَ مَآ أَمَرَهُمۡ وَيَفۡعَلُونَ مَا يُؤۡمَرُونَ","66:10":"ضَرَبَ ٱللَّهُ مَثَلٗا لِّلَّذِينَ كَفَرُواْ ٱمۡرَأَتَ نُوحٖ وَٱمۡرَأَتَ لُوطٖۖ كَانَتَا تَحۡتَ عَبۡدَيۡنِ مِنۡ عِبَادِنَا صَٰلِحَيۡنِ فَخَانَتَاهُمَا فَلَمۡ يُغۡنِيَا عَنۡهُمَا مِنَ ٱللَّهِ شَيۡـٔٗا وَقِيلَ ٱدۡخُلَا ٱلنَّارَ مَعَ ٱلدَّـٰخِلِينَ","66:11":"وَضَرَبَ ٱللَّهُ مَثَلٗا لِّلَّذِينَ ءَامَنُواْ ٱمۡرَأَتَ فِرۡعَوۡنَ إِذۡ قَالَتۡ رَبِّ ٱبۡنِ لِي عِندَكَ بَيۡتٗا فِي ٱلۡجَنَّةِ وَنَجِّنِي مِن فِرۡعَوۡنَ وَعَمَلِهِۦ وَنَجِّنِي مِنَ ٱلۡقَوۡمِ ٱلظَّـٰلِمِينَ","66:12":"وَمَرۡيَمَ ٱبۡنَتَ عِمۡرَٰنَ ٱلَّتِيٓ أَحۡصَنَتۡ فَرۡجَهَا فَنَفَخۡنَا فِيهِ مِن رُّوحِنَا وَصَدَّقَتۡ بِكَلِمَٰتِ رَبِّهَا وَكُتُبِهِۦ وَكَانَتۡ مِنَ ٱلۡقَٰنِتِينَ","67:2":"ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ","67:3":"ٱلَّذِي خَلَقَ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗاۖ مَّا تَرَىٰ فِي خَلۡقِ ٱلرَّحۡمَٰنِ مِن تَفَٰوُتٖۖ فَٱرۡجِعِ ٱلۡبَصَرَ هَلۡ تَرَىٰ مِن فُطُورٖ","67:4":"ثُمَّ ٱرۡجِعِ ٱلۡبَصَرَ كَرَّتَيۡنِ يَنقَلِبۡ إِلَيۡكَ ٱلۡبَصَرُ خَاسِئٗا وَهُوَ حَسِيرٞ","67:8":"تَكَادُ تَمَيَّزُ مِنَ ٱلۡغَيۡظِۖ كُلَّمَآ أُلۡقِيَ فِيهَا فَوۡجٞ سَأَلَهُمۡ خَزَنَتُهَآ أَلَمۡ يَأۡتِكُمۡ نَذِيرٞ","67:9":"قَالُواْ بَلَىٰ قَدۡ جَآءَنَا نَذِيرٞ فَكَذَّبۡنَا وَقُلۡنَا مَا نَزَّلَ ٱللَّهُ مِن شَيۡءٍ إِنۡ أَنتُمۡ إِلَّا فِي ضَلَٰلٖ كَبِيرٖ","67:10":"وَقَالُواْ لَوۡ كُنَّا نَسۡمَعُ أَوۡ نَعۡقِلُ مَا كُنَّا فِيٓ أَصۡحَٰبِ ٱلسَّعِيرِ","68:4":"وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٖ","69:4":"كَذَّبَتۡ ثَمُودُ وَعَادُۢ بِٱلۡقَارِعَةِ","69:5":"فَأَمَّا ثَمُودُ فَأُهۡلِكُواْ بِٱلطَّاغِيَةِ","69:6":"وَأَمَّا عَادٞ فَأُهۡلِكُواْ بِرِيحٖ صَرۡصَرٍ عَاتِيَةٖ","69:7":"سَخَّرَهَا عَلَيۡهِمۡ سَبۡعَ لَيَالٖ وَثَمَٰنِيَةَ أَيَّامٍ حُسُومٗاۖ فَتَرَى ٱلۡقَوۡمَ فِيهَا صَرۡعَىٰ كَأَنَّهُمۡ أَعۡجَازُ نَخۡلٍ خَاوِيَةٖ","69:8":"فَهَلۡ تَرَىٰ لَهُم مِّنۢ بَاقِيَةٖ","69:19":"فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَيَقُولُ هَآؤُمُ ٱقۡرَءُواْ كِتَٰبِيَهۡ","69:20":"إِنِّي ظَنَنتُ أَنِّي مُلَٰقٍ حِسَابِيَهۡ","69:21":"فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ","69:22":"فِي جَنَّةٍ عَالِيَةٖ","69:23":"قُطُوفُهَا دَانِيَةٞ","69:24":"كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ","69:25":"وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِشِمَالِهِۦ فَيَقُولُ يَٰلَيۡتَنِي لَمۡ أُوتَ كِتَٰبِيَهۡ","69:26":"وَلَمۡ أَدۡرِ مَا حِسَابِيَهۡ","70:4":"تَعۡرُجُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ إِلَيۡهِ فِي يَوۡمٖ كَانَ مِقۡدَارُهُۥ خَمۡسِينَ أَلۡفَ سَنَةٖ","70:19":"۞إِنَّ ٱلۡإِنسَٰنَ خُلِقَ هَلُوعًا","70:20":"إِذَا مَسَّهُ ٱلشَّرُّ جَزُوعٗا","70:21":"وَإِذَا مَسَّهُ ٱلۡخَيۡرُ مَنُوعًا","70:24":"وَٱلَّذِينَ فِيٓ أَمۡوَٰلِهِمۡ حَقّٞ مَّعۡلُومٞ","70:25":"لِّلسَّآئِلِ وَٱلۡمَحۡرُومِ","70:40":"فَلَآ أُقۡسِمُ بِرَبِّ ٱلۡمَشَٰرِقِ وَٱلۡمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ","71:5":"قَالَ رَبِّ إِنِّي دَعَوۡتُ قَوۡمِي لَيۡلٗا وَنَهَارٗا","71:6":"فَلَمۡ يَزِدۡهُمۡ دُعَآءِيٓ إِلَّا فِرَارٗا","71:7":"وَإِنِّي كُلَّمَا دَعَوۡتُهُمۡ لِتَغۡفِرَ لَهُمۡ جَعَلُوٓاْ أَصَٰبِعَهُمۡ فِيٓ ءَاذَانِهِمۡ وَٱسۡتَغۡشَوۡاْ ثِيَابَهُمۡ وَأَصَرُّواْ وَٱسۡتَكۡبَرُواْ ٱسۡتِكۡبَارٗا","71:8":"ثُمَّ إِنِّي دَعَوۡتُهُمۡ جِهَارٗا","71:9":"ثُمَّ إِنِّيٓ أَعۡلَنتُ لَهُمۡ وَأَسۡرَرۡتُ لَهُمۡ إِسۡرَارٗا","71:16":"وَجَعَلَ ٱلۡقَمَرَ فِيهِنَّ نُورٗا وَجَعَلَ ٱلشَّمۡسَ سِرَاجٗا","72:1":"قُلۡ أُوحِيَ إِلَيَّ أَنَّهُ ٱسۡتَمَعَ نَفَرٞ مِّنَ ٱلۡجِنِّ فَقَالُوٓاْ إِنَّا سَمِعۡنَا قُرۡءَانًا عَجَبٗا","72:2":"يَهۡدِيٓ إِلَى ٱلرُّشۡدِ فَـَٔامَنَّا بِهِۦۖ وَلَن نُّشۡرِكَ بِرَبِّنَآ أَحَدٗا","72:8":"وَأَنَّا لَمَسۡنَا ٱلسَّمَآءَ فَوَجَدۡنَٰهَا مُلِئَتۡ حَرَسٗا شَدِيدٗا وَشُهُبٗا","72:9":"وَأَنَّا كُنَّا نَقۡعُدُ مِنۡهَا مَقَٰعِدَ لِلسَّمۡعِۖ فَمَن يَسۡتَمِعِ ٱلۡأٓنَ يَجِدۡ لَهُۥ شِهَابٗا رَّصَدٗا","72:11":"وَأَنَّا مِنَّا ٱلصَّـٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَۖ كُنَّا طَرَآئِقَ قِدَدٗا","73:4":"أَوۡ زِدۡ عَلَيۡهِ وَرَتِّلِ ٱلۡقُرۡءَانَ تَرۡتِيلًا","74:30":"عَلَيۡهَا تِسۡعَةَ عَشَرَ","74:31":"وَمَا جَعَلۡنَآ أَصۡحَٰبَ ٱلنَّارِ إِلَّا مَلَـٰٓئِكَةٗۖ وَمَا جَعَلۡنَا عِدَّتَهُمۡ إِلَّا فِتۡنَةٗ لِّلَّذِينَ كَفَرُواْ لِيَسۡتَيۡقِنَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ وَيَزۡدَادَ ٱلَّذِينَ ءَامَنُوٓاْ إِيمَٰنٗا وَلَا يَرۡتَابَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ وَٱلۡمُؤۡمِنُونَ وَلِيَقُولَ ٱلَّذِينَ فِي قُلُوبِهِم مَّرَضٞ وَٱلۡكَٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلٗاۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهۡدِي مَن يَشَآءُۚ وَمَا يَعۡلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَۚ وَمَا هِيَ إِلَّا ذِكۡرَىٰ لِلۡبَشَرِ","75:2":"وَلَآ أُقۡسِمُ بِٱلنَّفۡسِ ٱللَّوَّامَةِ","75:3":"أَيَحۡسَبُ ٱلۡإِنسَٰنُ أَلَّن نَّجۡمَعَ عِظَامَهُۥ","75:4":"بَلَىٰ قَٰدِرِينَ عَلَىٰٓ أَن نُّسَوِّيَ بَنَانَهُۥ","75:16":"لَا تُحَرِّكۡ بِهِۦ لِسَانَكَ لِتَعۡجَلَ بِهِۦٓ","75:17":"إِنَّ عَلَيۡنَا جَمۡعَهُۥ وَقُرۡءَانَهُۥ","75:18":"فَإِذَا قَرَأۡنَٰهُ فَٱتَّبِعۡ قُرۡءَانَهُۥ","75:23":"إِلَىٰ رَبِّهَا نَاظِرَةٞ","76:3":"إِنَّا هَدَيۡنَٰهُ ٱلسَّبِيلَ إِمَّا شَاكِرٗا وَإِمَّا كَفُورًا","78:6":"أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ مِهَٰدٗا","78:7":"وَٱلۡجِبَالَ أَوۡتَادٗا","79:24":"فَقَالَ أَنَا۠ رَبُّكُمُ ٱلۡأَعۡلَىٰ","79:30":"وَٱلۡأَرۡضَ بَعۡدَ ذَٰلِكَ دَحَىٰهَآ","79:44":"إِلَىٰ رَبِّكَ مُنتَهَىٰهَآ","80:1":"عَبَسَ وَتَوَلَّىٰٓ","80:2":"أَن جَآءَهُ ٱلۡأَعۡمَىٰ","80:3":"وَمَا يُدۡرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ","80:4":"أَوۡ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكۡرَىٰٓ","80:5":"أَمَّا مَنِ ٱسۡتَغۡنَىٰ","80:6":"فَأَنتَ لَهُۥ تَصَدَّىٰ","80:7":"وَمَا عَلَيۡكَ أَلَّا يَزَّكَّىٰ","80:8":"وَأَمَّا مَن جَآءَكَ يَسۡعَىٰ","80:9":"وَهُوَ يَخۡشَىٰ","80:10":"فَأَنتَ عَنۡهُ تَلَهَّىٰ","81:1":"إِذَا ٱلشَّمۡسُ كُوِّرَتۡ","81:2":"وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتۡ","81:3":"وَإِذَا ٱلۡجِبَالُ سُيِّرَتۡ","81:4":"وَإِذَا ٱلۡعِشَارُ عُطِّلَتۡ","81:5":"وَإِذَا ٱلۡوُحُوشُ حُشِرَتۡ","81:6":"وَإِذَا ٱلۡبِحَارُ سُجِّرَتۡ","81:7":"وَإِذَا ٱلنُّفُوسُ زُوِّجَتۡ","81:8":"وَإِذَا ٱلۡمَوۡءُۥدَةُ سُئِلَتۡ","81:9":"بِأَيِّ ذَنۢبٖ قُتِلَتۡ","81:10":"وَإِذَا ٱلصُّحُفُ نُشِرَتۡ","81:11":"وَإِذَا ٱلسَّمَآءُ كُشِطَتۡ","81:12":"وَإِذَا ٱلۡجَحِيمُ سُعِّرَتۡ","81:13":"وَإِذَا ٱلۡجَنَّةُ أُزۡلِفَتۡ","81:14":"عَلِمَتۡ نَفۡسٞ مَّآ أَحۡضَرَتۡ","82:1":"إِذَا ٱلسَّمَآءُ ٱنفَطَرَتۡ","82:2":"وَإِذَا ٱلۡكَوَاكِبُ ٱنتَثَرَتۡ","82:3":"وَإِذَا ٱلۡبِحَارُ فُجِّرَتۡ","82:4":"وَإِذَا ٱلۡقُبُورُ بُعۡثِرَتۡ","82:5":"عَلِمَتۡ نَفۡسٞ مَّا قَدَّمَتۡ وَأَخَّرَتۡ","83:1":"وَيۡلٞ لِّلۡمُطَفِّفِينَ","83:2":"ٱلَّذِينَ إِذَا ٱكۡتَالُواْ عَلَى ٱلنَّاسِ يَسۡتَوۡفُونَ","83:3":"وَإِذَا كَالُوهُمۡ أَو وَّزَنُوهُمۡ يُخۡسِرُونَ","85:4":"قُتِلَ أَصۡحَٰبُ ٱلۡأُخۡدُودِ","85:5":"ٱلنَّارِ ذَاتِ ٱلۡوَقُودِ","85:6":"إِذۡ هُمۡ عَلَيۡهَا قُعُودٞ","85:7":"وَهُمۡ عَلَىٰ مَا يَفۡعَلُونَ بِٱلۡمُؤۡمِنِينَ شُهُودٞ","85:8":"وَمَا نَقَمُواْ مِنۡهُمۡ إِلَّآ أَن يُؤۡمِنُواْ بِٱللَّهِ ٱلۡعَزِيزِ ٱلۡحَمِيدِ","87:18":"إِنَّ هَٰذَا لَفِي ٱلصُّحُفِ ٱلۡأُولَىٰ","87:19":"ص /* Normalisation arabe (identique au contrôle des références) */
const DIA = /[ً-ٰٟۖ-ۭـ]/;
function nc(c) { if (DIA.test(c) || c === 'ء') return ''; if ('ٱأإآ'.includes(c)) return 'ا'; if (c === 'ى' || c === 'ئ') return 'ي'; if (c === 'ؤ') return 'و'; if (c === 'ة') return 'ه'; return c; }

/* Surligne les mots entiers qui contiennent le mot-clé (évite de casser la liaison des lettres) */
function hl(text, kw) {
  if (!kw) return esc(text);
  const chars = [...text]; let n = ''; const idx = [];
  chars.forEach((c, i) => { const m = nc(c); if (m) { n += m; idx.push(i); } });
  const k = norm(kw); const p = n.indexOf(k); if (p < 0) return esc(text);

  while (s > 0 && chars[s - 1] !== ' ') s--; while (e < chars.length && chars[e] !== ' ') e++;
  return esc(chars.slice(0, s).join('')) + '<mark>' + esc(chars.slice(s, e).join('')) + '</mark>' + esc(chars.slice(e).join(''));
}

/* ───────────────────────── Tajwīd : coloration */
const TJR = DATA.tj.rules.filter(r => r.color).map(r => { let rx = null; try { rx = new RegExp(r.rx, 'gu'); } catch (e) {} return { ...r, rx }; }).filter(r => r.rx);
const TJPRIO = ['madd-lazim','madd-muttasil','madd-munfasil','iqlab','idgham-ng','idgham-g','idgham-mithlayn','ikhfa','ikhfa-shafawi','ghunna','qalqala','lam-shamsi','wasl','muet'];
TJR.sort((a, b) => TJPRIO.indexOf(a.id) - TJPRIO.indexOf(b.id));
const MARK = /[ً-ٰٟۡ-۪ۨ-ۭ]/;
function tjClasses(text) {
  const ch = [...text]; const cls = new Array(ch.length).fill(null);
  /* les index de RegExp sont en unités UTF-16 ; le texte arabe est entièrement dans le plan de base */
  for (const r of TJR) {
    r.rx.lastIndex = 0; let m;
    while ((m = r.rx.exec(text))) {
      let s = m.index, e = s + m[0].length;
      while (s < e && ch[s] === ' ') s++;
      while (e < ch.length && MARK.test(ch[e])) e++;
      if (m[0].length === 0) { r.rx.lastIndex++; continue; }
      let free = true; for (let i = s; i < e; i++) if (cls[i]) { free = false; break; }
      if (free) for (let i = s; i < e; i++) cls[i] = r.color;
    }
  }
  return { ch, cls };
}
/* Rendu d'un mot coloré : liaison des lettres préservée par des ZWJ aux frontières */
function runsHTML(ch, cls, a, b) {
  const runs = []; for (let i = a; i < b; i++) { const c = cls ? cls[i] : null; if (runs.length && runs[runs.length - 1].c === c) runs[runs.length - 1].t += ch[i]; else runs.push({ c, t: ch[i] }); }
  return runs.map((r, i) => { const t = (i > 0 ? '‍' : '') + esc(r.t) + (i < runs.length - 1 ? '‍' : ''); return r.c ? `<span class="tj-${r.c}">${t}</span>` : t; }).join('');
}
function verseHTML(text, { tj = TJ, words = false } = {}) {
  const { ch, cls } = tj ? tjClasses(text) : { ch: [...text], cls: null };
  let out = '', i = 0, w = 0;
  while (i < ch.length) {
    if (ch[i] === ' ') { out += ' '; i++; w++; continue; }
    let j = i; while (j < ch.length && ch[j] !== ' ') j++;
    const word = ch.slice(i, j).join('');
    const isSign = /^[ۖ-ۭ۞۩]+$/.test(word);
    const inner = runsHTML(ch, cls, i, j);
    out += words && !isSign ? `<span class="w" data-w="${esc(word)}" data-i="${w}">${inner}</span>` : inner;
    i = j;
  }
  return out;
}
/* Exemple de règle : lettres concernées colorées */
function exampleHTML(text, s, e, color) {
  const ch = [...text]; const cls = new Array(ch.length).fill(null);
  for (let i = s; i < e; i++) cls[i] = color || 'ex';
  let out = '', i = 0;
  while (i < ch.length) { if (ch[i] === ' ') { out += ' '; i++; continue; } let j = i; while (j < ch.length && ch[j] !== ' ') j++; const inWord = s < j && e > i; out += inWord ? `<span class="tjbg">${runsHTML(ch, cls, i, j)}</span>` : esc(ch.slice(i, j).join('')); i = j; }
  return out;
}

/* ───────────────────────── Navigation (pile interne : fonctionne dans l'app Android, l'app Claude et Safari) */
let STACK = [], CUR = 'accueil';
const SCROLL = {};
function sectionOf(h) {
  if (h.startsWith('lire')) return 'lire';
  if (h.startsWith('regles')) return 'regles';
  if (h === 'sujets' || h.startsWith('t-') || h.startsWith('b-')) return 'sujets';
  if (h === 'accueil') return 'accueil';
  return 'plus';
}
function go(h, opt = {}) {
  h = h || 'accueil';
  if (SHEET) closeSheet();
  SCROLL[CUR] = window.pageYOffset;
  if (opt.tab) STACK = [h]; else if (opt.replace) STACK[STACK.length - 1] = h; else if (STACK[STACK.length - 1] !== h) STACK.push(h);
  if (!opt.fromPop) { try { history.pushState({ h }, '', '#' + h); } catch (e) {} }
  render(h, opt.restore ? SCROLL[h] : 0);
}
function back() {
  if (SHEET) { closeSheet(); return true; }
  if (STACK.length > 1) { STACK.pop(); const h = STACK[STACK.length - 1]; SCROLL[CUR] = 0; try { history.replaceState({ h }, '', '#' + h); } catch (e) {} render(h, SCROLL[h] || 0); return true; }
  if (CUR !== 'accueil') { STACK = ['accueil']; render('accueil', 0); return true; }
  return false;
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'), a = g ? null : e.target.closest('a[href^="#"]');
  if (!g && !a) return;
  e.preventDefault();
  const h = (g ? g.getAttribute('data-go') : a.getAttribute('href').slice(1));
  if (h === '__back') { back(); return; }
  const el = g || a;
  go(h, { tab: !!el.dataset.tab, replace: !!el.dataset.replace });
}, true);

        h += notes.length ? `<div class="sec">${B(['Dans les explications','في الشروح'])} <span class="n">${notes.length}</span></div><div class="list">${notes.slice(0, 25).join('')}</div>` : ''; }

  const fr = `<div class="prose"><h3>Source unique</h3><p>Le texte arabe du Coran (114 sourates, 6 236 versets), écriture ʿuthmānī du muṣḥaf de Médine (lecture de Ḥafṣ), issu de l'Encyclopédie du Noble Coran via le paquet open source quran-json (licence CC BY 4.0). Aucun tafsīr ni aucune traduction existante n'a servi à construire l'arbre.</p>
   <h3>Le texte s'explique par lui-même</h3><p>Un verset est éclairé par son contexte et par les autres emplois de ses mots, comme le texte le demande (4:82, 39:23).</p>
   <h3>Contenu</h3><p>${roots.length} branches, ${DATA.tree.length - roots.length} sujets, ${nR} passages classés, ${DATA.qa.length} questions, ${DATA.people.length} personnages, ${DATA.lex.length} racines, ${DATA.tj.rules.length} règles de lecture.</p>
   <h3>Six natures</h3><table>${ORDER.map(k => `<tr><td class="t-${k}"><b>${TYPES[k][0]}</b></td><td>${TDESC[k][0]}</td></tr>`).join('')}</table>
   <h3>Règles de lecture</h3><p>Les règles de tajwīd sont celles de la lecture de Ḥafṣ ʿan ʿĀṣim. Elles ne viennent pas du sens du texte mais de la tradition de récitation, que le muṣḥaf note par ses signes. Les exemples et les comptes sont détectés automatiquement à partir de ces signes ; la coloration est une aide et ne remplace pas l'écoute d'un récitateur.</p>
   <h3>Audio</h3><p>Les récitations sont diffusées depuis leurs sources : everyayah.com (Ḥafṣ, verset par verset) et mp3quran.net (autres lectures, par sourate). Elles appartiennent à leurs récitants et producteurs ; aucun fichier audio n'est inclus dans l'application. L'écoute demande une connexion, sauf pour les sourates téléchargées dans l'application Android ; la page claude.ai bloque les sons externes.</p>
   <h3>Dictionnaire</h3><p>Chaque mot est rattaché à sa racine et à son mot de base d'après la morphologie du Quranic Arabic Corpus (v0.4, © Kais Dukes, université de Leeds, licence GNU GPL), dans la version corrigée de mustafa0x/quran-morphology. Le sens de chacune des ${DICT ? DICT.stats.roots : '1 651'} racines et de chaque mot-outil est rédigé pour ce projet à partir de l'arabe, sans tafsīr.</p>
   <h3>Généalogie</h3><p>${esc(DATA.gen.note[0])}</p>
   <h3>Contrôle</h3><p>Chaque référence est vérifiée automatiquement : le mot-clé surligné doit se trouver dans le verset cité.</p>
   <h3>Limites</h3><p>L'arbre est une sélection organisée, pas un index complet. Les lectures sont des propositions à discuter, pas des avis religieux.</p><p class="n">Version ${esc(DATA.version)}</p></div>`;
  const ar = `<div class="prose arb" style="color:var(--ink)"><p>المصدر الوحيد هو النص العربي للقرآن برسم المصحف (رواية حفص). أحكام التلاوة مأخوذة من رواية حفص عن عاصم كما تدل عليها علامات المصحف، والأمثلة مستخرجة آليًّا. ورُدّت كل كلمة في القاموس إلى جذرها بحسب الصرف في مدوّنة القرآن العربية (Quranic Arabic Corpus، رخصة GPL)، وشُرحت معاني الجذور والأدوات من العربية دون تفسير. هذه قراءات للنقاش لا فتاوى.</p></div>`;
  return { title: esc(L(['Méthode et sources','المنهج والمصادر'])), html: LANG === 'fr' ? fr : LANG === 'ar' ? ar : fr + ar };
}

/* ───────────────────────── Thème, langue, démarrage */
function applyTheme() {
  const r = document.documentElement;
  if (THEME === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', THEME);
  const dark = THEME === 'dark' || (THEME === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const bg = dark ? '#111715' : '#f3f4ee';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', bg));
  const C = window.Capacitor; if (C && C.Plugins && C.Plugins.StatusBar) { try { C.Plugins.StatusBar.setStyle({ style: dark ? 'DARK' : 'LIGHT' }); C.Plugins.StatusBar.setBackgroundColor({ color: bg }); } catch (e) {} }
}
function setLang(l) { LANG = l; S.set('lang', l); document.documentElement.lang = l === 'ar' ? 'ar' : 'fr'; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; }
function start() {
  setLang(LANG); applyTheme(); setAr(ARSIZE); initAudio(); initOffline();

  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }
  /* Android : bouton retour matériel */
  const C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform()) {
    document.documentElement.classList.add('native');
    try { C.Plugins.App.addListener('backButton', () => { if (!back()) C.Plugins.App.exitApp(); }); } catch (e) {}
    try { C.Plugins.SplashScreen.hide(); } catch (e) {}
  }
  let h = ''; try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  h = h || 'accueil';
  STACK = TABS.includes(h) ? [h] : ['accueil', h];
  try { history.replaceState({ h }, '', '#' + h); } catch (e) {}
  render(h);
}

/* ───────────────────────── Audio : écoute et apprentissage du tajwīd
   Ḥafṣ : verset par verset (texte synchronisé, répétition, pause pour répéter).
   Autres lectures : sourate entière, la numérotation de leurs versets différant de celle de Ḥafṣ. */
const AU = {
  rec: S.get('rec', 'husary-muallim'), rep: S.get('rep', 1), gap: S.get('gap', 0), rate: S.get('rate', 1),
  s: 0, a: 0, single: false, count: 0, on: false, waiting: null, mode: 'verse',
};
const REC = Object.fromEntries(DATA.audio.reciters.map(r => [r.id, r]));
const RIW = Object.fromEntries(DATA.audio.riwayat.map(r => [r.id, r]));
if (!REC[AU.rec]) AU.rec = 'husary-muallim';
const audioEl = () => document.getElementById('au');
const isHafs = id => REC[id] && REC[id].riw === 'hafs';
const pad3 = n => String(n).padStart(3, '0');
function srcFor(rec, s, a) {
  /* Fichier présent sur le téléphone (application Android) en priorité, sinon la source en ligne */
  return (typeof localFor === 'function' && localFor(rec, s, a)) || srcRemote(rec, s, a);
}
function srcRemote(rec, s, a) {
  const r = REC[rec];
  return r.riw === 'hafs' ? `https://everyayah.com/data/${r.dir}/${pad3(s)}${pad3(a)}.mp3` : `${r.dir}${pad3(s)}.mp3`;
}
function recName(id) { const r = REC[id]; return `${L([r.fr, r.ar])} · ${L([RIW[r.riw].fr, RIW[r.riw].ar])}`; }

function playVerse(s, a, opt = {}) {
  if (!isHafs(AU.rec)) { if (opt.single || opt.forceHafs) AU.rec = S.get('recHafs', 'husary-muallim'); else return playSura(s); }
  clearTimeout(AU.waiting); AU.waiting = null;
  AU.mode = 'verse'; AU.s = s; AU.a = a; AU.single = !!opt.single; AU.count = 0; AU.on = true;
  /* Basmala jouée avant le premier verset (sauf al-Fātiḥa, où elle est le verset 1, et at-Tawba) */
  AU.basmala = a === 1 && s !== 1 && s !== 9 && !opt.single && !opt.noBasmala;
  const el = audioEl(); el.src = AU.basmala ? srcFor(AU.rec, 1, 1) : srcFor(AU.rec, s, a); el.playbackRate = AU.rate;
  const p = el.play(); if (p && p.catch) p.catch(audioFail);
  showPlayer(); markPlaying(); mediaMeta();
}
function playSura(s) {
  clearTimeout(AU.waiting); AU.waiting = null;
  AU.mode = 'sura'; AU.s = s; AU.a = 0; AU.single = false; AU.on = true;
  const el = audioEl(); el.src = srcFor(AU.rec, s, 1); el.playbackRate = AU.rate;
  const p = el.play(); if (p && p.catch) p.catch(audioFail);
  showPlayer(); markPlaying(); mediaMeta();
}
function audioFail(e) {
  if (e && e.name === 'AbortError') return;
  AU.on = false; showPlayer();
  if (NATIVE) { toast(L(["Cette sourate n'est pas sur le téléphone et la connexion manque. Téléchargez-la dans « Écoute hors ligne ».", 'هذه السورة غير محمّلة ولا يوجد اتصال.'])); return; }
  toast(L(["Lecture impossible : vérifiez la connexion. La page claude.ai bloque les sons externes ; utilisez l'application ou le fichier HTML.", 'تعذّر التشغيل: تحقق من الاتصال.']));
}
function stopAudio() { clearTimeout(AU.waiting); AU.waiting = null; const el = audioEl(); el.pause(); el.removeAttribute('src'); try { el.load(); } catch (e) {} AU.on = false; AU.s = 0; showPlayer(); markPlaying(); }
function togglePlay() {
  const el = audioEl();
  if (!AU.s) return;
  if (AU.waiting) { clearTimeout(AU.waiting); AU.waiting = null; AU.on = false; showPlayer(); return; }
  if (el.paused) { const p = el.play(); if (p && p.catch) p.catch(audioFail); AU.on = true; } else { el.pause(); AU.on = false; }
  showPlayer();
}
function stepVerse(d) {
  if (AU.mode === 'sura') { const n = AU.s + d; if (SURA[n]) playSura(n); return; }
  const n = AU.a + d, max = SURA[AU.s][4];
  if (n >= 1 && n <= max) playVerse(AU.s, n, { single: AU.single });
}
function onEnded() {
  if (AU.mode === 'sura') { AU.on = false; showPlayer(); return; }
  if (AU.basmala) { playVerse(AU.s, 1, { noBasmala: true }); return; }
  AU.count++;
  const el = audioEl(); const dur = (el.duration || 4) * 1000 / AU.rate;
  const again = AU.rep === 0 || AU.count < AU.rep;
  const next = () => {
    AU.waiting = null;
    if (again) { el.currentTime = 0; const p = el.play(); if (p && p.catch) p.catch(audioFail); showPlayer(); return; }
    if (AU.single || AU.a >= SURA[AU.s][4]) { AU.on = false; showPlayer(); markPlaying(); return; }
    playVerse(AU.s, AU.a + 1);
  };
  if (AU.gap) { AU.waiting = setTimeout(next, Math.min(dur, 30000)); showPlayer(true); } else next();
}
function markPlaying() {
  document.querySelectorAll('.verse.playing').forEach(v => v.classList.remove('playing'));
  if (!AU.s || AU.mode !== 'verse' || !CUR.startsWith('lire-' + AU.s)) return;
  const el = document.getElementById('v-' + AU.a); if (!el) return;
  el.classList.add('playing');
  const r = el.getBoundingClientRect(); const top = 120, bottom = window.innerHeight - 150;
  if (r.top < top || r.bottom > bottom) window.scrollTo({ top: r.top + window.pageYOffset - 130, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function mediaMeta() {
  if (!('mediaSession' in navigator) || !AU.s) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: `${SURA[AU.s][2]}${AU.mode === 'verse' ? ' · ' + AU.a : ''}`, artist: REC[AU.rec].fr, album: RIW[REC[AU.rec].riw].fr });
    navigator.mediaSession.setActionHandler('play', togglePlay); navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', () => stepVerse(-1)); navigator.mediaSession.setActionHandler('nexttrack', () => stepVerse(1));
  } catch (e) {}
}
const REPS = [1, 3, 5, 0], RATES = [0.75, 1, 1.25];
function showPlayer(waiting) {
  const p = document.getElementById('player');
  if (!AU.s) { p.hidden = true; document.body.classList.remove('has-player'); return; }
  p.hidden = false; document.body.classList.add('has-player');
  const el = audioEl(); const playing = AU.on && !el.paused;
  const ref = AU.mode === 'verse' ? `${AU.s}:${AU.a}` : `${SURA[AU.s][2]} · ${L(['sourate entière', 'السورة كاملة'])}`;
  p.innerHTML = `<div class="pl-top"><button class="pl-rec" data-pa="rec">${ico('book', 'sm')}<span><b>${esc(ref)}</b><br><span class="n">${esc(recName(AU.rec))}</span></span></button><button class="ib" data-pa="close" aria-label="${esc(L(['Fermer', 'إغلاق']))}">${ico('close', 'sm')}</button></div>
   ${waiting ? `<div class="pl-wait">${esc(L(['À vous : répétez le verset…', 'دورك: ردّد الآية…']))}</div>` : ''}
   <div class="pl-ctl">
     <button class="ib" data-pa="prev" aria-label="Précédent">${ico('prev', 'sm flip')}</button>
     <button class="pl-play" data-pa="toggle" aria-label="${playing ? 'Pause' : 'Lecture'}">${playing || waiting ? '<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>' : '<svg class="i" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>'}</button>
     <button class="ib" data-pa="next" aria-label="Suivant">${ico('next', 'sm flip')}</button>
     ${AU.mode === 'verse' ? `<button class="chip" data-pa="rep" aria-label="Répétitions">↻ ${AU.rep === 0 ? '∞' : '×' + AU.rep}</button>
     <button class="chip" data-pa="gap" aria-pressed="${!!AU.gap}">${esc(L(['Pause pour répéter', 'وقفة للترديد']))}</button>` : ''}
     <button class="chip" data-pa="rate">${AU.rate}×</button>
   </div>`;
}
document.addEventListener('click', e => {
  const pa = e.target.closest('[data-pa]');
  if (pa) {
    const a = pa.dataset.pa;
    if (a === 'toggle') togglePlay(); else if (a === 'prev') stepVerse(-1); else if (a === 'next') stepVerse(1); else if (a === 'close') stopAudio();
    else if (a === 'rep') { AU.rep = REPS[(REPS.indexOf(AU.rep) + 1) % REPS.length]; S.set('rep', AU.rep); AU.count = 0; showPlayer(); }
    else if (a === 'gap') { AU.gap = AU.gap ? 0 : 1; S.set('gap', AU.gap); showPlayer(); }
    else if (a === 'rate') { AU.rate = RATES[(RATES.indexOf(AU.rate) + 1) % RATES.length]; S.set('rate', AU.rate); audioEl().playbackRate = AU.rate; showPlayer(); }
    else if (a === 'rec') reciterSheet();
    return;
  }
  const pv = e.target.closest('[data-play]');
  if (pv) { e.preventDefault(); const [s, a] = pv.dataset.play.split(':').map(x => parseInt(x, 10)); playVerse(s, a, { single: pv.dataset.single === '1' }); return; }

  const pr = e.target.closest('[data-setrec]');
  if (pr) { setRec(pr.dataset.setrec); closeSheet(); if (AU.s) (isHafs(AU.rec) ? playVerse(AU.s, AU.a || 1, { single: AU.single }) : playSura(AU.s)); else toast(recName(AU.rec)); if (CUR.startsWith('lire-')) render(CUR, window.pageYOffset); }
});
function setRec(id) { if (!REC[id]) return; AU.rec = id; S.set('rec', id); if (isHafs(id)) S.set('recHafs', id); }

/* ───────────────────────── Écoute hors ligne (application Android)
   Les récitations sont téléchargées sur le téléphone depuis leur source, puis lues sans connexion.
   Dans la page web, elles restent lues en ligne. */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const FSP = () => window.Capacitor.Plugins.Filesystem;
let DL = S.get('dl', {});            // { récitant: { sourate: octets, b: true si basmala } }
let LOCALBASE = null;                 // URI du dossier audio sur le téléphone
let JOB = null;                       // téléchargement en cours
let WIFIONLY = S.get('wifionly', true);
const JUZ_AMMA = Array.from({ length: 37 }, (_, i) => 78 + i);

function relPath(rec, s, a) { return isHafs(rec) ? `audio/${rec}/${pad3(s)}${pad3(a)}.mp3` : `audio/${rec}/${pad3(s)}.mp3`; }
function isDone(rec, s) { return !!(DL[rec] && DL[rec][s]); }
function localURL(rec, s, a) { return LOCALBASE ? window.Capacitor.convertFileSrc(LOCALBASE + '/' + relPath(rec, s, a).slice(6)) : null; }
function localFor(rec, s, a) {

async function startDownload(rec, suras, force) {
  if (!NATIVE) { toast(L(["Le téléchargement est disponible dans l'application Android.", 'التحميل متاح في تطبيق أندرويد.'])); return; }
  if (JOB) { toast(L(['Un téléchargement est déjà en cours.', 'هناك تحميل جارٍ.'])); return; }
  suras = suras.filter(s => !isDone(rec, s));
  if (!suras.length) { toast(L(['Déjà disponible hors ligne.', 'متاح دون اتصال.'])); return; }
  const net = await connection();
  if (!net.connected) { toast(L(['Pas de connexion : le téléchargement demande Internet.', 'لا يوجد اتصال.'])); return; }
  const est = estimate(rec, suras);
  if (WIFIONLY && net.connectionType !== 'wifi' && !force) {
    openSheet(esc(L(['Données mobiles', 'بيانات الجوال'])), `<p>${esc(L([`Vous n'êtes pas en Wi-Fi. Ce téléchargement pèse environ ${fmtMB(est)}.`, `لست على شبكة Wi-Fi. الحجم التقريبي ${fmtMB(est)}.`]))}</p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri" data-dlforce="${rec}|${suras.join(',')}">${esc(L(['Télécharger quand même', 'التحميل رغم ذلك']))}</button><button class="btn" data-go="__back">${esc(L(['Attendre le Wi-Fi', 'انتظار Wi-Fi']))}</button></div>`);
    return;
  }
  const files = [];
  if (isHafs(rec)) {
    if (!(DL[rec] && DL[rec].b) && !suras.includes(1) && suras.some(s => s !== 9)) files.push({ s: 0, a: 1, basmala: true });
    suras.forEach(s => { for (let a = 1; a <= SURA[s][4]; a++) files.push({ s, a }); });
  } else suras.forEach(s => files.push({ s, a: 0 }));
  const left = {}; files.forEach(f => { if (f.s) left[f.s] = (left[f.s] || 0) + 1; });
  JOB = { rec, suras, files, i: 0, done: 0, failed: 0, bytes: {}, left, total: files.length, paused: false, stop: false, est };
  drawJob();
  const worker = async () => {
    while (JOB && !JOB.stop && !JOB.paused && JOB.i < JOB.files.length) {
      const f = JOB.files[JOB.i++];
      const s = f.basmala ? 1 : f.s, a = f.basmala ? 1 : f.a;
      const path = relPath(rec, s, a);
      let size = 0, ok = false;
      for (let t = 0; t < 2 && !ok; t++) {
        try {
          try { const st = await FSP().stat({ path, directory: 'DATA' }); if (st.size > 0) { size = st.size; ok = true; break; } } catch (e) {}
          await FSP().downloadFile({ url: srcRemote(rec, s, a), path, directory: 'DATA', recursive: true });
          const st = await FSP().stat({ path, directory: 'DATA' }); size = st.size; ok = size > 0;
        } catch (e) { ok = false; }
      }
      if (!JOB) return;
      if (ok) {
        JOB.done++;
        if (f.basmala) { DL[rec] = DL[rec] || {}; DL[rec].b = true; S.set('dl', DL); }
        else { JOB.bytes[f.s] = (JOB.bytes[f.s] || 0) + size; if (--JOB.left[f.s] === 0) { DL[rec] = DL[rec] || {}; DL[rec][f.s] = JOB.bytes[f.s]; if (f.s === 1 && isHafs(rec)) DL[rec].b = true; S.set('dl', DL); } }
      } else JOB.failed++;
      drawJob();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (!JOB) return;
  const j = JOB; JOB = null;
  if (j.paused) { PAUSED = { rec: j.rec, suras: j.suras }; drawJob(); return; }
  PAUSED = null;
  toast(j.failed ? L([`Terminé avec ${j.failed} fichier(s) en échec : relancez pour compléter.`, `انتهى مع ${j.failed} ملف فاشل.`]) : L(['Téléchargement terminé : écoute hors ligne disponible.', 'اكتمل التحميل.']));
  if (CUR === 'horsligne' || CUR.startsWith('lire-')) render(CUR, window.pageYOffset);
}

      const n = ev.target.closest('[data-gnode]'), e = ev.target.closest('[data-gedge]');
      if (n) { const id = n.dataset.gnode, node = GN[id]; if (P[id]) go('p-' + id); else openSheet(esc(L([node.fr, node.ar])), vcard({ ref: node.ref, kw: node.kw, sm: true })); return; }
      if (e) { const ed = GEN.edges[+e.dataset.gedge]; openSheet(esc(L([ed.fr, ed.ar])), `<p class="n">${esc(L([GN[ed.from].fr, GN[ed.from].ar]))} → ${esc(L([GN[ed.to].fr, GN[ed.to].ar]))}</p>${vcard({ ref: ed.ref, kw: ed.kw, sm: true })}`); }
    });
    setTimeout(() => center(GFOCUS || 'ibrahim'), 60); GFOCUS = null;
  } };
}

/* ───────────────────────── Dictionnaire : tous les mots du Coran, par racine
   dict.json : roots [racine, sens ar, sens fr, occurrences, [lemmes]]
               lemmas [lemme, racine, nature ar, nature fr, occurrences, [[forme, n]], références]
               fw [mot, sens ar, sens fr, occurrences, références, nom propre]
   Une référence = 4 caractères en base 36 : (index du verset × 256 + rang du mot dans le verset). */
let DICT = null, DREF = null, DFW = null;
let DQ = '', DLET = 'ا', DMODE = 'r';
const DALPHA = [...'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'];
const DFOLD = c => ('أإآءٱ'.includes(c) ? 'ا' : 'ىئ'.includes(c) ? 'ي' : c === 'ؤ' ? 'و' : c);
async function loadDict() {
  if (DICT) return;
  if (window.QDICT) DICT = window.QDICT; else { const r = await fetch('dict.json'); DICT = await r.json(); }
  DICT.roots.forEach(r => { r.k = norm(r[0]); r.l = DFOLD([...r[0]][0]); });
  DICT.lemmas.forEach(l => { l.k = ' ' + norm(l[0]) + ' ' + l[5].map(f => norm(f[0])).join(' ') + ' '; });
  DICT.fw.forEach(f => { f.k = norm(f[0].replace(/^ضمير ?.*/, '')); });
}
function dictIndex() {
  if (DREF) return;
  DREF = new Map(); DFW = new Map();
  DICT.lemmas.forEach((l, i) => { const s = l[6]; for (let j = 0; j < s.length; j += 4) DREF.set(s.substr(j, 4), i); });
  DICT.fw.forEach((f, i) => { const s = f[4]; for (let j = 0; j < s.length; j += 4) { const c = s.substr(j, 4); const a = DFW.get(c); a ? a.push(i) : DFW.set(c, [i]); } });
}
const dcode = (k, tok) => (QI[k] * 256 + tok).toString(36).padStart(4, '0');
const ddec = c => { const n = parseInt(c, 36); return [Math.floor(n / 256), n % 256]; };
const spaced = r => [...r].join(' ');
function dtokHL(text, tok) { return text.split(' ').map((x, i) => i === tok ? `<mark>${esc(x)}</mark>` : esc(x)).join(' '); }
function dhits(refs, from, n) {
  const out = [];
  for (let j = from * 4; j < refs.length && out.length < n; j += 4) {
    const [gi, tok] = ddec(refs.substr(j, 4)); const v = QURAN[gi]; if (!v) continue;
    out.push(`<a class="hit" href="#lire-${v[0]}-${v[1]}"><span class="ref"><b>${v[0]}:${v[1]}</b> · <span class="arsm">${esc(SURA[v[0]][1])}</span></span><div class="qtext sm">${dtokHL(v[2], tok)}</div></a>`);
  }
  return out.join('');
}
/* Liste de versets dépliable, 30 à la fois */
function dverses(id, refs) {
  const n = refs.length / 4;
  return `<button class="btn" data-dv="${id}" aria-expanded="false">${ico('book', 'sm')}${esc(L(['Versets','الآيات']))} (${n})</button><div class="list dvl" id="dv-${id}" hidden data-from="0"></div>`;
}
function bindVerses(getRefs) {
  M().querySelectorAll('[data-dv]').forEach(b => b.onclick = async () => {
    const box = document.getElementById('dv-' + b.dataset.dv); const open = box.hidden;
    box.hidden = !open; b.setAttribute('aria-expanded', open);
    if (open && !box.dataset.done) { await loadQ(); more(box, getRefs(b.dataset.dv)); box.dataset.done = 1; }
  });
  function more(box, refs) {
    const from = +box.dataset.from; box.querySelector('.dmore') && box.querySelector('.dmore').remove();
    box.insertAdjacentHTML('beforeend', dhits(refs, from, 30)); box.dataset.from = from + 30;
    if ((from + 30) * 4 < refs.length) {
      box.insertAdjacentHTML('beforeend', `<button class="btn dmore" style="margin:8px">${esc(L(['Afficher la suite','عرض المزيد']))}</button>`);
      box.querySelector('.dmore').onclick = () => more(box, refs);
    }
  }
}
function rootRow(i) {
  const r = DICT.roots[i];
  return listRow('dict-' + i, `<span class="droot">${esc(spaced(r[0]))}</span>`, LANG === 'ar' ? esc(r[1]) : esc(r[2]) + (LANG === 'both' ? ` <span class="arsm">${esc(r[1])}</span>` : ''), '', `<span class="n">${r[3]}</span>`);
}
function fwRow(i) {
  const f = DICT.fw[i]; const w = f[0].startsWith('ضمير') ? f[1].split(':')[1] || f[0] : f[0];
  return listRow('dictf-' + i, `<span class="droot" style="letter-spacing:0">${esc(w.trim())}</span>`, LANG === 'ar' ? esc(f[1]) : esc(f[2]) + (LANG === 'both' ? ` <span class="arsm">${esc(f[1])}</span>` : ''), '', `<span class="n">${f[3]}</span>`);
}
function dictMatch(raw) {
  const isAr = /[؀-ۿ]/.test(raw);
  if (isAr) {
    const k = norm(raw).replace(/\s+/g, '');
    const rs = new Set();
    DICT.roots.forEach((r, i) => { if (r.k === k || norm(r[1]).includes(k)) rs.add(i); });
    DICT.lemmas.forEach(l => { if (l.k.includes(' ' + k + ' ')) rs.add(l[1]); });
    if (rs.size < 40) DICT.lemmas.forEach(l => { if (l.k.includes(k)) rs.add(l[1]); });
    const fs = DICT.fw.map((f, i) => (f.k && (f.k === k || f.k.includes(k))) || norm(f[1]).includes(k) ? i : -1).filter(i => i >= 0);
    return [[...rs].sort((a, b) => (DICT.roots[a].k === k ? -1 : 0) - (DICT.roots[b].k === k ? -1 : 0) || a - b), fs];
  }
  const q = fold(raw);
  return [DICT.roots.map((r, i) => fold(r[2]).includes(q) ? i : -1).filter(i => i >= 0), DICT.fw.map((f, i) => fold(f[2]).includes(q) ? i : -1).filter(i => i >= 0)];
}
async function viewDict() {
  await loadDict();
  const st = DICT.stats;
  const html = `<p class="lead">${esc(L([`Chaque mot du Coran est rattaché à sa racine : ${st.words.toLocaleString('fr')} mots, ${st.roots.toLocaleString('fr')} racines, ${st.lemmas.toLocaleString('fr')} mots de base. Le sens est donné d'après l'arabe, sans tafsīr.`, `كل كلمة في القرآن مردودة إلى جذرها: ${toAr(st.words)} كلمة، ${toAr(st.roots)} جذرًا، ${toAr(st.lemmas)} لفظًا. والمعنى مأخوذ من العربية دون تفسير.`]))}</p>
   <input class="field" id="dq" type="search" placeholder="${esc(L(['Mot arabe, racine ou sens en français','كلمة أو جذر أو معنى']))}" value="${esc(DQ)}" autocomplete="off" aria-label="Rechercher dans le dictionnaire">
   <div class="seg" style="margin:10px 0" role="group">${[['r', ['Racines', 'الجذور']], ['f', ['Mots-outils', 'الأدوات والضمائر']], ['n', ['Noms propres', 'الأعلام']]].map(([k, l]) => `<button data-dm="${k}" aria-pressed="${DMODE === k}">${esc(L(l))}</button>`).join('')}</div>
   <div class="dletters" id="dlet"${DMODE === 'r' ? '' : ' hidden'}>${DALPHA.map(c => `<button data-dlet="${c}" aria-pressed="${DLET === c}">${c}</button>`).join('')}</div>
   <div class="list" id="dres"></div>`;
  return { title: esc(L(['Dictionnaire','القاموس'])), html, after() {
    const out = document.getElementById('dres');
    const draw = () => {
      const raw = DQ.trim();
      if (raw.length >= 2) {
        const [rs, fs] = dictMatch(raw);
        out.innerHTML = (rs.length ? `<div class="sec" style="padding:8px 12px">${B(['Racines', 'الجذور'])} <span class="n">${rs.length}</span></div>` + rs.slice(0, 80).map(rootRow).join('') : '')
          + (fs.length ? `<div class="sec" style="padding:8px 12px">${B(['Mots-outils et noms propres', 'الأدوات والأعلام'])} <span class="n">${fs.length}</span></div>` + fs.slice(0, 40).map(fwRow).join('') : '')
          || `<p class="empty">${esc(L(['Aucun mot trouvé.', 'لا نتائج.']))}</p>`;
        return;
      }
      if (DMODE === 'r') out.innerHTML = DICT.roots.map((r, i) => r.l === DLET ? rootRow(i) : '').join('');
      else out.innerHTML = DICT.fw.map((f, i) => (f[5] ? 'n' : 'f') === DMODE ? fwRow(i) : '').join('');
    };
    draw();
    let tm; document.getElementById('dq').oninput = e => { DQ = e.target.value; clearTimeout(tm); tm = setTimeout(draw, 180); };
    M().querySelectorAll('[data-dm]').forEach(b => b.onclick = () => { DMODE = b.dataset.dm; DQ = ''; document.getElementById('dq').value = ''; M().querySelectorAll('[data-dm]').forEach(x => x.setAttribute('aria-pressed', x === b)); document.getElementById('dlet').hidden = DMODE !== 'r'; draw(); });
    M().querySelectorAll('[data-dlet]').forEach(b => b.onclick = () => { DLET = b.dataset.dlet; DQ = ''; document.getElementById('dq').value = ''; M().querySelectorAll('[data-dlet]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  } };
}
async function viewDictRoot(i) {
  await loadDict();
  const r = DICT.roots[i]; if (!r) return viewDict();
  const lem = r[4].map(j => DICT.lemmas[j]);
  let h = `<a class="crumb" href="#dictionnaire">${B(['Dictionnaire', 'القاموس'])}</a>
   <div class="card dhead"><div class="droot big">${esc(spaced(r[0]))}</div>
   ${LANG !== 'fr' ? `<p class="arb" style="color:var(--ink);margin:6px 0 0">${esc(r[1])}</p>` : ''}${LANG !== 'ar' ? `<p style="margin:6px 0 0">${esc(r[2])}</p>` : ''}
   <p class="n" style="margin:8px 0 0">${esc(L([`${r[3]} occurrence(s) · ${lem.length} mot(s) de base`, `${toAr(r[3])} موضعًا · ${toAr(lem.length)} لفظًا`]))}</p></div>
   <div class="sec">${B(['Mots issus de cette racine', 'الألفاظ المشتقة'])}</div><div class="stack">`;
  lem.forEach((l, k) => {
    h += `<div class="card dlem"><div class="row" style="justify-content:space-between;align-items:baseline;gap:10px"><span class="dw">${esc(l[0])}</span><span class="n">${B([l[3], l[2]])} · ${l[4]}</span></div>
     <div class="chips" style="margin:8px 0">${l[5].map(([f, c]) => `<span class="chip"><span class="dform">${esc(f)}</span>${c > 1 ? ` <span class="n">${c}</span>` : ''}</span>`).join('')}</div>
     ${dverses(r[4][k], l[6])}</div>`;
  });
  h += `</div><div class="pager">${i > 0 ? `<a class="btn" href="#dict-${i - 1}" data-replace="1">${ico('prev', 'sm flip')}${esc(spaced(DICT.roots[i - 1][0]))}</a>` : '<span></span>'}${i < DICT.roots.length - 1 ? `<a class="btn" href="#dict-${i + 1}" data-replace="1">${esc(spaced(DICT.roots[i + 1][0]))}${ico('next', 'sm flip')}</a>` : ''}</div>`;
  return { title: `${esc(L(['Racine', 'الجذر']))} <span class="ar">${esc(r[0])}</span>`, html: h, after() { bindVerses(j => DICT.lemmas[+j][6]); } };
}
async function viewDictFw(i) {
  await loadDict();
  const f = DICT.fw[i]; if (!f) return viewDict();
  const h = `<a class="crumb" href="#dictionnaire">${B(['Dictionnaire', 'القاموس'])}</a>
   <div class="card dhead"><div class="droot big" style="letter-spacing:0">${esc(f[0].startsWith('ضمير') ? (f[1].split(':')[1] || f[0]).trim() : f[0])}</div>
   <p class="n" style="margin:4px 0 0">${esc(L(f[5] ? ['Nom propre', 'اسم علم'] : ['Mot-outil', 'أداة أو ضمير']))}</p>
   ${LANG !== 'fr' ? `<p class="arb" style="color:var(--ink);margin:6px 0 0">${esc(f[1])}</p>` : ''}${LANG !== 'ar' ? `<p style="margin:6px 0 0">${esc(f[2])}</p>` : ''}
   <p class="n" style="margin:8px 0 10px">${esc(L([`${f[3]} occurrence(s)`, `${toAr(f[3])} موضعًا`]))}</p>${dverses('f' + i, f[4])}</div>`;
  return { title: esc(L(['Dictionnaire', 'القاموس'])), html: h, after() { bindVerses(() => f[4]); } };
}
/* Fiche d'un mot touché dans le lecteur */
async function wordDictHTML(k, tok) {
  try { await loadDict(); } catch (e) { return ''; }
  dictIndex();
  const c = dcode(k, tok); const li = DREF.get(c); const fs = DFW.get(c) || [];
  let h = '';
  if (li != null) {
    const l = DICT.lemmas[li], r = DICT.roots[l[1]];
    h += `<a class="card dsheet" href="#dict-${l[1]}" style="display:block;text-decoration:none;color:var(--ink)"><div class="row" style="justify-content:space-between;gap:10px"><span class="dw">${esc(l[0])}</span><span class="n">${B([l[3], l[2]])}</span></div>
     <div class="n" style="margin-top:4px">${esc(L(['Racine', 'الجذر']))} <b class="droot" style="font-size:1.15rem">${esc(spaced(r[0]))}</b> · ${r[3]}</div>
     ${LANG !== 'fr' ? `<div class="arb" style="color:var(--ink)">${esc(r[1])}</div>` : ''}${LANG !== 'ar' ? `<div>${esc(r[2])}</div>` : ''}
     <div class="n" style="margin-top:6px;color:var(--gold)">${esc(L(['Ouvrir dans le dictionnaire', 'افتح في القاموس']))} ›</div></a>`;
  }
  fs.forEach(i => { const f = DICT.fw[i]; h += `<a class="card dsheet" href="#dictf-${i}" style="display:block;text-decoration:none;color:var(--ink);margin-top:6px"><b>${esc(f[0].startsWith('ضمير') ? (f[1].split(':')[1] || f[0]).trim() : f[0])}</b> — ${LANG === 'ar' ? esc(f[1]) : esc(f[2])}${LANG === 'both' ? ` <span class="arsm">${esc(f[1])}</span>` : ''}</a>`; });
  return h ? `<div style="margin-bottom:10px">${h}</div>` : '';
}
/* Section du dictionnaire dans la recherche globale */
async function dictSearchHTML(raw) {
  try { await loadDict(); } catch (e) { return ''; }
  const [rs, fs] = dictMatch(raw); const n = rs.length + fs.length; if (!n) return '';
  return `<div class="sec">${B(['Dictionnaire', 'القاموس'])} <span class="n">${n}</span></div><div class="list">${rs.slice(0, 10).map(rootRow).join('')}${fs.slice(0, 4).map(fwRow).join('')}</div>`;
}

start();
